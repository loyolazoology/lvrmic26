<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentation Access | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
.t-Oral{background:rgba(232,201,131,.14);color:var(--gold-light);}
.t-Poster{background:rgba(120,160,230,.14);color:#9db8ee;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.achip{background:rgba(232,201,131,.08);border:1px solid var(--navy-border);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--text-1);}
.gh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;background:rgba(232,201,131,.06);border-bottom:1px solid var(--navy-border);cursor:pointer;}
.gh h4{margin:0;font-size:14px;color:var(--gold-light);display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.gh h4 small{color:var(--text-3);font-size:12px;font-weight:400;}
.gh .chev{font-size:11px;color:var(--text-3);}
.gcard.closed .gb{display:none;}
.fn{font-size:11.5px;color:var(--text-3);display:block;margin-top:4px;word-break:break-all;}
.dl-ok{font-size:11.5px;color:var(--teal-light);display:block;margin-top:4px;}
table.list td.ti{white-space:normal;min-width:220px;max-width:380px;}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-display" style="color:var(--gold-light);"></i> Presentation access</h1><div id="xp"></div></div>
<div class="wrap" style="max-width:1250px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="card" id="banner" style="display:none;"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search by name, VRMIC ID or title" autocomplete="off">
    <select id="fv"><option value="">All venues</option></select>
    <select id="fp"><option value="">All presenters</option><option value="up">PPT uploaded</option><option value="no">PPT missing</option></select>
    <button class="btn btn-sm" id="toggle"><i class="fa-solid fa-angles-down"></i> Collapse all</button>
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
  </div>
  <div id="groups"><div class="empty">Loading presentations…</div></div>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('presentationAccess', 'report')) { VR.denied('You do not have permission to view this page.'); return; }

let rows = [], info = {}, busy = false, closed = new Set(), allClosed = false;
const nz = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().toLowerCase();
const gkey = r => [r.venue, r.room, r.date, r.time].join('|');
const day = d => /^\d{4}-\d{2}-\d{2}/.test(String(d)) ? fmtD(String(d).slice(0, 10)) : String(d || '');
const slotText = x => [x.venue, x.room ? 'Room ' + x.room : '', day(x.date), x.time].filter(Boolean).join(' · ');
const when = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true }); };
const safe = s => String(s || '').replace(/[\\/:*?"<>|]+/g, '_').trim();
const b64ToBlob = (b64, mime) => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime || 'application/octet-stream' }); };
const saveBlob = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); };
async function fetchFile(id) { const r = await VR.api('getPresentationFile', { id }); if (!r.ok) throw new Error(r.error || 'Download failed'); return r; }

const filtered = () => { const q = nz($('q').value), v = $('fv').value, p = $('fp').value;
  return rows.filter(r => (!q || nz(r.name).includes(q) || nz(r.id).includes(q) || nz(r.abstractTitle).includes(q)) && (!v || r.venue === v) && (!p || (p === 'up' ? r.hasPPT : !r.hasPPT && r.participantType !== 'Poster'))); };
const pptStatus = r => r.hasPPT ? 'Uploaded' : (r.participantType === 'Poster' ? 'Printed poster' : 'Not uploaded');

function pptCell(r) {
  if (r.hasPPT) return '<button class="btn btn-sm btn-gold" data-dl="' + esc(r.id) + '"><i class="fa-solid fa-download"></i> Download</button>'
    + (r.fileName ? '<span class="fn">' + esc(r.fileName) + '</span>' : '') + (r.uploadedAt ? '<span class="fn">Uploaded ' + esc(when(r.uploadedAt)) + '</span>' : '')
    + (r.downloadedAt ? '<span class="dl-ok"><i class="fa-solid fa-check"></i> Downloaded ' + esc(when(r.downloadedAt)) + '</span>' : '');
  return r.participantType === 'Poster' ? '<span class="badge s-Out">Printed poster</span>' : '<span class="badge s-Late">Not uploaded</span>';
}

function render() {
  const list = filtered(), host = $('groups');
  if (!list.length) { host.innerHTML = '<div class="empty">' + (info.isVolunteer && !(info.assignments || []).length ? "You don't have any assignments yet. Contact the organisers." : 'No presenters match.') + '</div>'; return; }
  const order = [], map = {};
  list.forEach(r => { const k = gkey(r); if (!map[k]) { map[k] = []; order.push(k); } map[k].push(r); });
  host.innerHTML = order.map(k => {
    const g = map[k], h = g[0], up = g.filter(x => x.hasPPT).length, shut = closed.has(k);
    return '<div class="table-card gcard' + (shut ? ' closed' : '') + '" data-k="' + esc(k) + '" style="margin-bottom:18px;">'
      + '<div class="gh" data-head="1"><h4><i class="fa-solid fa-chevron-' + (shut ? 'right' : 'down') + ' chev"></i>' + esc(slotText(h) || 'No slot allotted') + '<small>' + g.length + ' presenter' + (g.length > 1 ? 's' : '') + ' · ' + up + ' PPT' + (up === 1 ? '' : 's') + ' uploaded</small></h4>'
      + (up ? '<button class="btn btn-sm noprint" data-zip="' + esc(k) + '"><i class="fa-solid fa-file-zipper"></i> Download all (' + up + ') as ZIP</button>' : '') + '</div>'
      + '<div class="gb scroll-x"><table class="list"><thead><tr><th>Token</th><th>VRMIC ID</th><th>Name</th><th>Type</th><th>Title</th><th>Institution</th><th>Presentation</th></tr></thead><tbody>'
      + g.map(r => '<tr><td class="id">' + esc(r.token || '—') + '</td><td class="id">' + esc(r.id) + '</td><td class="nm">' + esc(r.name) + '</td><td><span class="badge t-' + esc(r.participantType) + '">' + esc(r.participantType) + '</span></td><td class="ti">' + esc(r.abstractTitle || '—') + '</td><td>' + esc(r.institution || '—') + '</td><td>' + pptCell(r) + '</td></tr>').join('')
      + '</tbody></table></div></div>';
  }).join('');
}

$('groups').addEventListener('click', async e => {
  const one = e.target.closest('[data-dl]'), zip = e.target.closest('[data-zip]');
  if (!one && !zip) {   // click a slot header to collapse / expand it
    const h = e.target.closest('[data-head]'); if (!h) return;
    const k = h.parentElement.dataset.k; closed.has(k) ? closed.delete(k) : closed.add(k); render(); return;
  }
  if (busy) return; hideAlerts(); busy = true;
  try {
    if (one) {
      const btn = one, old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const f = await fetchFile(btn.dataset.dl), r = rows.find(x => x.id === btn.dataset.dl);
        saveBlob(b64ToBlob(f.data, f.mimeType), safe((r && r.token ? r.token + '_' : '') + (r ? r.id + '_' : '') + f.fileName));
        if (r) r.downloadedAt = new Date().toISOString();
        busy = false; render();
      } finally { btn.disabled = false; btn.innerHTML = old; }
    } else {
      if (typeof JSZip === 'undefined') return showErr('The ZIP tool could not load. Check your internet connection and refresh.');
      const key = zip.dataset.zip, g = rows.filter(r => gkey(r) === key && r.hasPPT), btn = zip, old = btn.innerHTML, z = new JSZip(), failed = [];
      btn.disabled = true;
      for (let i = 0; i < g.length; i++) {
        btn.innerHTML = '<span class="spinner"></span> ' + (i + 1) + ' / ' + g.length;
        try { const f = await fetchFile(g[i].id); z.file(safe((g[i].token ? g[i].token + '_' : '') + g[i].id + '_' + g[i].name + '_' + f.fileName), f.data, { base64: true }); g[i].downloadedAt = new Date().toISOString(); }
        catch (er) { failed.push(g[i].name + ' (' + er.message + ')'); }
      }
      if (g.length > failed.length) { btn.innerHTML = 'Building ZIP…'; saveBlob(await z.generateAsync({ type: 'blob' }), safe(g[0].venue + '_' + g[0].date + '_' + g[0].time) + '.zip'); }
      btn.disabled = false; btn.innerHTML = old; busy = false; render();
      if (failed.length) showErr(failed.length + ' file(s) could not be added: ' + failed.join('; ')); else showOk('ZIP ready — ' + g.length + ' presentation' + (g.length > 1 ? 's' : '') + '.');
    }
  } catch (er) { showErr(er.message || 'Download failed.'); }
  finally { busy = false; }
});
['q'].forEach(i => $(i).addEventListener('input', render)); ['fv', 'fp'].forEach(i => $(i).addEventListener('change', render));
$('toggle').onclick = () => { allClosed = !allClosed; closed = new Set(allClosed ? rows.map(gkey) : []); $('toggle').innerHTML = allClosed ? '<i class="fa-solid fa-angles-up"></i> Expand all' : '<i class="fa-solid fa-angles-down"></i> Collapse all'; render(); };

async function load() {
  $('groups').innerHTML = '<div class="empty">Loading presentations…</div>';
  try {
    const r = await VR.api('getPresentationAccess', {});
    if (!r.ok) { $('groups').innerHTML = ''; return showErr(r.error || 'Could not load.'); }
    info = r; rows = r.participants || [];
    const b = $('banner'); b.style.display = '';
    b.innerHTML = r.isVolunteer
      ? '<h3 style="margin:0 0 10px;"><i class="fa-solid fa-location-dot"></i> Your assignments</h3>' + ((r.assignments || []).length ? '<div class="chips">' + r.assignments.map(a => '<span class="achip">' + esc(a) + '</span>').join('') + '</div>' : '<p class="hint" style="margin:0;">Nothing is assigned to you yet.</p>')
      : '<h3 style="margin:0;"><i class="fa-solid fa-display"></i> All presenters</h3><p class="hint" style="margin:6px 0 0;">Organiser view — volunteers only see the presenters assigned to them.</p>';
    const vs = [...new Set(rows.map(x => x.venue).filter(Boolean))];
    $('fv').innerHTML = '<option value="">All venues</option>' + vs.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
    render();
  } catch (e) { $('groups').innerHTML = ''; showErr('Could not reach the server. Check your connection and try again.'); }
}
$('refresh').onclick = load;

VR.exportBar($('xp'), { name: 'VRMIC2026_Presentation_List', title: 'VRMIC 2026 — Presentation list', imageEl: () => $('groups'), pdfOpts: { orientation: 'landscape' },
  getData: () => ({ headers: ['Venue', 'Room', 'Date', 'Time', 'Token', 'VRMIC ID', 'Name', 'Type', 'Title', 'Institution', 'PPT'],
    rows: filtered().map(r => [r.venue || '', r.room || '', day(r.date), r.time || '', r.token || '', r.id, r.name, r.participantType, r.abstractTitle || '', r.institution || '', pptStatus(r)]) }) });

load();
})();
</script>
</body>
</html>
