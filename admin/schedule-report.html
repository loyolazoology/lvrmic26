<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Report | LVRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.rp-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px;}
.rp-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.rp-sum div{border:1px solid var(--navy-border);border-radius:10px;padding:8px 14px;background:var(--navy-950);font-size:12px;color:var(--text-3);}
.rp-sum b{display:block;font-size:20px;color:var(--gold-light);font-family:'IBM Plex Mono',monospace;}
.rp-wrap{overflow:auto;border:1px solid var(--navy-border);border-radius:12px;}
.rp-t{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px;}
.rp-t th,.rp-t td{border-bottom:1px solid var(--navy-border);padding:7px 9px;text-align:left;vertical-align:top;}
.rp-t th{position:sticky;top:0;background:#131d38;color:var(--text-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap;}
.rp-t tr.day td{background:rgba(232,201,131,.1);color:var(--gold-light);font-weight:700;}
.rp-t .mono{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.rp-t tr.draft td{opacity:.65;}
.rp-chip{font:700 11px Inter,sans-serif;padding:2px 8px;border-radius:999px;}
.rp-chip.pub{background:rgba(60,180,120,.15);color:var(--success);} .rp-chip.draft{background:rgba(232,201,131,.15);color:var(--gold-light);}
.rp-tl{display:grid;gap:14px;margin-top:6px;}
.rp-tl h4{margin:0 0 6px;font-size:13px;color:var(--text-2);}
.rp-lane{position:relative;height:30px;border:1px solid var(--navy-border);border-radius:8px;background:var(--navy-950);margin-bottom:4px;}
.rp-lane span.hl{position:absolute;left:-0px;top:-16px;font-size:10.5px;color:var(--text-3);}
.rp-bar{position:absolute;top:3px;bottom:3px;border-radius:6px;background:rgba(232,201,131,.28);border:1px solid var(--gold);font-size:10.5px;color:var(--text-1);padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:22px;}
.rp-bar.draft{border-style:dashed;opacity:.65;}
.rp-ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);font-family:'IBM Plex Mono',monospace;}
.rp-empty{text-align:center;padding:30px;color:var(--text-3);}
.rp-views{display:flex;gap:6px;margin-bottom:12px;}
.rp-views button[aria-pressed=true]{border-color:var(--gold);color:var(--gold-light);}
</style>
</head>
<body>
<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> Schedule report</h1><a class="btn btn-sm" href="schedule-manage.html"><i class="fa-solid fa-calendar-days"></i> Schedule editor</a></div>
<div class="wrap" style="max-width:1300px;">
  <div class="alert" id="err"></div>
  <div class="rp-filters">
    <div><label for="f-day">Day</label><select id="f-day"><option value="">All days</option></select></div>
    <div><label for="f-hall">Hall / venue</label><select id="f-hall"><option value="">All</option></select></div>
    <div><label for="f-type">Session type</label><select id="f-type"><option value="">All</option></select></div>
    <div><label for="f-st">Status</label><select id="f-st"><option value="">All</option><option>Published</option><option>Draft</option></select></div>
    <div><label for="f-q">Search</label><input id="f-q" placeholder="Name, chair, topic, speaker"></div>
  </div>
  <div class="rp-sum" id="sum"></div>
  <div class="sc-bar" style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
    <div class="rp-views" role="group" aria-label="View"><button class="btn btn-sm" id="v-tab" aria-pressed="true"><i class="fa-solid fa-table"></i> Table</button><button class="btn btn-sm" id="v-tl" aria-pressed="false"><i class="fa-solid fa-chart-gantt"></i> Timeline</button></div>
    <label style="display:flex;gap:6px;align-items:center;margin:0;"><input type="checkbox" id="f-items"> Show every item</label>
    <span style="flex:1"></span><div id="exp"></div>
  </div>
  <div id="main"></div>
</div>
<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!(VR.can('schedule', 'report') || VR.can('schedule', 'transaction'))) { VR.denied('You do not have permission to open the schedule report.'); return; }
let S = null, sortK = 'start', sortD = 1, view = 'tab', rows = [];
const q = s => document.querySelector(s);
const T = hm => hm ? hm12(hm) : '';
const min = hm => { const m = String(hm || '').match(/^(\d\d):(\d\d)$/); return m ? +m[1] * 60 + +m[2] : null; };
const TL = { registration: 'Registration', inaugural: 'Inaugural', plenary: 'Plenary', keynote: 'Keynote', oral: 'Oral', poster: 'Poster', panel: 'Panel', tea: 'Tea break', lunch: 'Lunch break', valedictory: 'Valedictory', other: 'Other' };
(async function init() {
  try { S = await VR.api('adminScheduleGet', {}); } catch (e) { return showErr('Could not reach the server.'); }
  if (!S.ok) return showErr(S.error || 'Could not load the schedule.');
  const dayBy = {}; S.days.forEach(d => dayBy[d.DayID] = d);
  rows = S.sessions.map(s => { const d = dayBy[s.DayID] || {}, its = S.items.filter(i => i.SessionID === s.SessionID), np = its.reduce((n, i) => n + ((S.presenters[i.ItemID] || []).length), 0);
    const judges = S.judges.filter(j => j.sessionId === s.SessionID).length;
    return { s: s, d: d, day: d.Date || '', dayNo: d.DayNo || 0, dayLabel: d.Label || ('Day ' + d.DayNo), hall: s.Hall || d.MainVenue || '', start: s.Start || '', end: s.End || '', items: its, np: np, judges: judges }; });
  q('#f-day').innerHTML += S.days.map(d => '<option value="' + esc(d.DayID) + '">' + esc((d.Label || 'Day ' + d.DayNo) + ' · ' + fmtD(d.Date)) + '</option>').join('');
  const uniq = a => Array.from(new Set(a.filter(Boolean))).sort();
  q('#f-hall').innerHTML += uniq(rows.map(r => r.hall)).map(h => '<option>' + esc(h) + '</option>').join('');
  q('#f-type').innerHTML += uniq(rows.map(r => r.s.Type)).map(t => '<option value="' + esc(t) + '">' + esc(TL[t] || t) + '</option>').join('');
  ['f-day', 'f-hall', 'f-type', 'f-st', 'f-items'].forEach(id => q('#' + id).onchange = draw); q('#f-q').oninput = draw;
  q('#v-tab').onclick = () => setView('tab'); q('#v-tl').onclick = () => setView('tl');
  VR.exportBar(q('#exp'), { name: 'schedule_report', title: 'LVRMIC 2026 schedule', getData: () => {
    const f = filtered(), withItems = q('#f-items').checked, out = [];
    f.forEach(r => { const base = [fmtD(r.day), r.dayLabel, r.s.Number ? 'Session ' + r.s.Number : '', r.s.Name, TL[r.s.Type] || r.s.Type, T(r.start), T(r.end), r.hall, r.s.Room, r.s.Chair, r.s.CoChair, r.s.Rapporteur, r.judges, r.np, r.s.Status];
      if (!withItems || !r.items.length) out.push(base.concat(['', '', '', '']));
      else r.items.forEach(i => out.push(base.concat([(T(i.Start) + (i.End ? ' – ' + T(i.End) : '')).trim(), i.Topic, i.Speaker, i.Affiliation]))); });
    return { headers: ['Date', 'Day', 'Session', 'Name', 'Type', 'Start', 'End', 'Hall', 'Room', 'Chairperson', 'Co-Chairperson', 'Rapporteur', 'Judges', 'Presenters', 'Status', 'Item time', 'Item topic', 'Speaker', 'Affiliation'], rows: out }; } });
  draw();
})();
function setView(v) { view = v; q('#v-tab').setAttribute('aria-pressed', v === 'tab'); q('#v-tl').setAttribute('aria-pressed', v === 'tl'); draw(); }
function filtered() {
  const d = q('#f-day').value, h = q('#f-hall').value, t = q('#f-type').value, st = q('#f-st').value, k = q('#f-q').value.trim().toLowerCase();
  let f = rows.filter(r => (!d || r.s.DayID === d) && (!h || r.hall === h) && (!t || r.s.Type === t) && (!st || r.s.Status === st) &&
    (!k || [r.s.Name, r.s.Chair, r.s.CoChair, r.s.Rapporteur, r.s.Room, r.hall].concat(r.items.map(i => i.Topic + ' ' + i.Speaker + ' ' + i.Affiliation)).join(' ').toLowerCase().indexOf(k) > -1));
  const val = r => sortK === 'start' ? (r.day + ' ' + (r.start || '99:99')) : sortK === 'name' ? r.s.Name.toLowerCase() : sortK === 'hall' ? r.hall.toLowerCase() : sortK === 'chair' ? (r.s.Chair || '').toLowerCase() : sortK === 'np' ? String(1e6 + r.np) : '';
  return f.slice().sort((a, b) => val(a) < val(b) ? -sortD : val(a) > val(b) ? sortD : 0);
}
function draw() {
  const f = filtered(); q('#sum').innerHTML = [['Sessions', f.length], ['Published', f.filter(r => r.s.Status === 'Published').length], ['Halls', new Set(f.map(r => r.hall).filter(Boolean)).size], ['Presenters placed', f.reduce((n, r) => n + r.np, 0)], ['Without chair', f.filter(r => !r.s.Chair && ['oral', 'poster', 'plenary', 'keynote', 'panel'].indexOf(r.s.Type) > -1).length]].map(x => '<div><b>' + x[1] + '</b>' + x[0] + '</div>').join('');
  if (!f.length) { q('#main').innerHTML = '<div class="card rp-empty">Nothing matches. ' + (rows.length ? 'Clear a filter.' : 'No sessions have been added yet — use the Schedule editor.') + '</div>'; return; }
  q('#main').innerHTML = view === 'tl' ? timeline(f) : table(f);
  document.querySelectorAll('.rp-t th[data-k]').forEach(th => th.onclick = () => { if (sortK === th.dataset.k) sortD = -sortD; else { sortK = th.dataset.k; sortD = 1; } draw(); });
}
function table(f) {
  const withItems = q('#f-items').checked; let last = null, h = '<div class="rp-wrap"><table class="rp-t"><thead><tr><th data-k="start">Time</th><th>Session</th><th data-k="name">Name</th><th data-k="hall">Hall / room</th><th data-k="chair">Chair · Co-chair · Rapporteur</th><th>Judges</th><th data-k="np">Presenters</th><th>Status</th></tr></thead><tbody>';
  f.forEach(r => {
    if (sortK === 'start' && sortD === 1 && r.day !== last) { last = r.day; h += '<tr class="day"><td colspan="8">' + esc(r.dayLabel) + ' · ' + esc(fmtD(r.day)) + '</td></tr>'; }
    h += '<tr class="' + (r.s.Status === 'Published' ? '' : 'draft') + '"><td class="mono">' + esc(T(r.start) + (r.end ? ' – ' + T(r.end) : '')) + '</td><td>' + esc(r.s.Number ? 'Session ' + r.s.Number : TL[r.s.Type] || '') + '</td><td><b>' + esc(r.s.Name) + '</b></td><td>' + esc(r.hall) + (r.s.Room ? ' / ' + esc(r.s.Room) : '') + '</td><td>' + [r.s.Chair, r.s.CoChair, r.s.Rapporteur].map(x => esc(x || '—')).join(' · ') + '</td><td>' + (r.judges || '—') + '</td><td>' + (r.np || '—') + '</td><td><span class="rp-chip ' + (r.s.Status === 'Published' ? 'pub' : 'draft') + '">' + esc(r.s.Status) + '</span></td></tr>';
    if (withItems) r.items.forEach(i => { h += '<tr class="' + (r.s.Status === 'Published' ? '' : 'draft') + '"><td class="mono" style="padding-left:22px;color:var(--text-3)">' + esc(T(i.Start) + (i.End ? ' – ' + T(i.End) : '')) + '</td><td colspan="7" style="color:var(--text-2)">' + esc([i.Topic, i.Speaker, i.Affiliation].filter(Boolean).join(' · ')) + '</td></tr>'; });
  });
  return h + '</tbody></table></div>';
}
function timeline(f) {
  const mins = f.map(r => min(r.start)).filter(x => x != null), maxs = f.map(r => min(r.end)).filter(x => x != null);
  if (!mins.length) return '<div class="card rp-empty">The sessions have no times yet.</div>';
  const a = Math.floor(Math.min.apply(null, mins) / 60) * 60, b = Math.ceil(Math.max.apply(null, maxs.concat(mins)) / 60) * 60 || a + 60, span = Math.max(60, b - a), days = {};
  f.forEach(r => (days[r.s.DayID] = days[r.s.DayID] || []).push(r));
  let h = '<div class="rp-tl">';
  Object.keys(days).forEach(did => {
    const list = days[did], halls = Array.from(new Set(list.map(r => r.hall || '—'))).sort();
    h += '<div class="card"><h4>' + esc(list[0].dayLabel) + ' · ' + esc(fmtD(list[0].day)) + '</h4>';
    halls.forEach(hl => { h += '<div style="font-size:11.5px;color:var(--text-3);margin:8px 0 3px;">' + esc(hl) + '</div><div class="rp-lane">' + list.filter(r => (r.hall || '—') === hl).map(r => { const s = min(r.start), e = min(r.end); if (s == null) return ''; const en = e == null ? s + 30 : e; return '<div class="rp-bar ' + (r.s.Status === 'Published' ? '' : 'draft') + '" style="left:' + ((s - a) / span * 100) + '%;width:' + Math.max(1.5, (en - s) / span * 100) + '%" title="' + esc(r.s.Name + ' · ' + T(r.start) + ' – ' + T(r.end)) + '">' + esc(r.s.Name) + '</div>'; }).join('') + '</div>'; });
    let ax = ''; for (let m = a; m <= b; m += 60) ax += '<span>' + hm12(String(Math.floor(m / 60)).padStart(2, '0') + ':00') + '</span>';
    h += '<div class="rp-ax" style="margin-top:4px;">' + ax + '</div></div>';
  });
  return h + '</div>';
}
})();
</script>
</body>
</html>
