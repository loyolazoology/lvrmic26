<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcement Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
table.list td{vertical-align:middle;}
table.list td.wrapc{white-space:normal;min-width:200px;max-width:460px;overflow-wrap:anywhere;line-height:1.45;}
table.list tr.main{cursor:pointer;}
.msg{color:var(--text-3);font-size:12.5px;margin-top:2px;white-space:pre-wrap;}
.msg.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-bullhorn" style="color:var(--gold-light);"></i> Announcement report</h1><a class="btn btn-sm" id="add" href="announcements-manage.html"><i class="fa-solid fa-plus"></i> New announcement</a></div>
<div class="wrap" style="max-width:1300px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search title or message" autocomplete="off">
    <select id="fs"><option value="">All</option><option value="on">Visible</option><option value="off">Hidden</option></select>
    <input type="date" id="df" style="width:auto;min-width:0;flex:none;" title="Posted from"><input type="date" id="dt" style="width:auto;min-width:0;flex:none;" title="Posted to">
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <div id="xp" style="margin-left:auto;"></div>
  </div>

  <div class="table-card">
    <div class="tiny" id="info" style="padding:12px 16px 0;"></div>
    <div class="scroll-x" id="tc"><table class="list"><thead><tr><th>Posted</th><th>Announcement</th><th>Poster</th><th>Posted by</th><th>Status</th></tr></thead>
      <tbody id="tb"><tr><td class="empty" colspan="5">Loading…</td></tr></tbody></table></div>
  </div>
  <p class="tiny noprint" style="margin-top:10px;">Click a row to read the full message. This is a view-only list; use <b>Announcements</b> to post, edit, hide or delete.</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('announcements', 'report') && !VR.can('announcements', 'transaction')) { VR.denied('You do not have permission to view the announcement report.'); return; }
if (!VR.can('announcements', 'transaction')) $('add').style.display = 'none';

const S = v => String(v == null ? '' : v);
let all = [], view = [], open = new Set();
const fdt = s => { const d = new Date(S(s)); return isNaN(d) ? '—' : d.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }); };
const day = a => S(a.createdAt).slice(0, 10);

function filtered() {
  const q = $('q').value.trim().toLowerCase(), s = $('fs').value, from = $('df').value, to = $('dt').value;
  return all.filter(a => {
    if (q && (a.title + ' ' + a.message).toLowerCase().indexOf(q) === -1) return false;
    if (s && (s === 'on') !== a.active) return false;
    if (from && day(a) < from) return false;
    if (to && day(a) > to) return false;
    return true;
  }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function stats() {
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  const on = all.filter(a => a.active).length, last = all.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
  $('stats').innerHTML = c('fa-bullhorn', 'Announcements', all.length, 'posted in total')
    + c('fa-eye', 'Visible to participants', on, Math.min(on, 10) + ' shown on the dashboard (latest 10)')
    + c('fa-eye-slash', 'Hidden', all.length - on, 'kept but not shown')
    + c('fa-clock', 'Latest post', last ? esc(fdt(last.createdAt)) : '—', last ? esc(last.title) : 'none yet');
  $('stats').querySelectorAll('.v')[3].style.fontSize = '1.05rem';
}

function render() {
  view = filtered();
  $('tb').innerHTML = view.length ? view.map(a => {
    const o = open.has(a.id);
    return '<tr class="main" data-k="' + esc(a.id) + '"><td>' + esc(fdt(a.createdAt)) + '</td>'
      + '<td class="wrapc"><span class="nm">' + esc(a.title) + '</span><div class="msg' + (o ? '' : ' clip') + '">' + esc(a.message) + '</div></td>'
      + '<td>' + (a.posterImageUrl ? '<a href="' + esc(a.posterImageUrl) + '" target="_blank" rel="noopener">View</a>' : '—') + '</td>'
      + '<td>' + esc(a.postedByName || a.postedBy || '—') + '</td>'
      + '<td><span class="badge ' + (a.active ? 'b-ok' : 'b-neu') + '">' + (a.active ? 'Visible' : 'Hidden') + '</span></td></tr>';
  }).join('') : '<tr><td class="empty" colspan="5">' + (all.length ? 'No announcements match these filters.' : 'No announcements yet.') + '</td></tr>';
  $('info').textContent = 'Showing ' + view.length + ' of ' + all.length;
  stats();
}

async function load() {
  hideAlerts();
  $('tb').innerHTML = '<tr><td class="empty" colspan="5">Loading…</td></tr>';
  try {
    const r = await VR.api('adminListAnnouncements', {});
    if (!r.ok) { showErr(r.error || 'Could not load announcements.'); $('tb').innerHTML = '<tr><td class="empty" colspan="5">Could not load.</td></tr>'; return; }
    all = r.announcements || []; render();
  } catch (e) { showErr('Could not reach the server. Check your connection and try again.'); $('tb').innerHTML = '<tr><td class="empty" colspan="5">Could not load.</td></tr>'; }
}

$('tb').onclick = e => {
  if (e.target.closest('a,button')) return;
  const tr = e.target.closest('tr.main'); if (!tr) return;
  const k = tr.dataset.k; open.has(k) ? open.delete(k) : open.add(k); render();
};
$('q').addEventListener('input', render);
['fs', 'df', 'dt'].forEach(i => $(i).addEventListener('change', render));
$('refresh').onclick = load;

VR.exportBar($('xp'), { name: 'VRMIC2026_Announcements', title: 'VRMIC 2026 — Announcement report', imageEl: () => $('tc'), pdfOpts: { orientation: 'landscape' },
  getData: () => ({ headers: ['Posted', 'Title', 'Message', 'Poster link', 'Posted by', 'Status'], rows: view.map(a => [fdt(a.createdAt), a.title, a.message, a.posterImageUrl, a.postedByName || a.postedBy, a.active ? 'Visible' : 'Hidden']) }) });

load();
})();
</script>
</body>
</html>
