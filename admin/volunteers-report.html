<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.achip{background:rgba(232,201,131,.08);border:1px solid var(--navy-border);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text-1);}
tr.dt > td{background:rgba(232,201,131,.04);}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> Volunteer report</h1><a class="btn btn-sm" id="al" href="volunteers-manage.html"><i class="fa-solid fa-user-group"></i> Assign volunteers</a></div>
<div class="wrap" style="max-width:1350px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search volunteer name or ID" autocomplete="off">
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <div id="xp" style="margin-left:auto;"></div>
  </div>

  <div class="table-card">
    <div class="tiny" id="info" style="padding:12px 16px 0;"></div>
    <div class="scroll-x" id="tc"><table class="list"><thead><tr><th style="width:26px;"></th><th>Volunteer</th><th>Assigned to</th><th>Presenters</th><th>PPTs available</th><th>PPTs downloaded</th><th>Last download</th></tr></thead>
      <tbody id="tb"><tr><td class="empty" colspan="7">Loading volunteers…</td></tr></tbody></table></div>
  </div>
  <p class="tiny noprint" style="margin-top:10px;">Click a volunteer to list their presenters. Totals add up each volunteer's own list, so a presenter covered by two volunteers counts twice.</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('volunteers', 'report') && !VR.can('volunteers', 'transaction')) { VR.denied('You do not have permission to view the volunteer report.'); return; }
if (!VR.can('volunteers', 'transaction')) $('al').style.display = 'none';

let vols = [], view = [], open = new Set();
const nz = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().toLowerCase();
const slotText = x => [x.venue, x.room ? 'Room ' + x.room : '', x.date, x.time].filter(Boolean).join(' · ');
const when = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true }); };
const pptTxt = p => p.hasPPT ? 'Uploaded' : (p.type === 'Poster' ? 'Printed poster' : 'Missing');

function render() {
  const q = nz($('q').value);
  view = vols.filter(v => !q || nz(v.name).includes(q) || nz(v.id).includes(q));
  const sum = k => vols.reduce((n, v) => n + (v.stats[k] || 0), 0);
  const c = (ic, h, val, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + val + '</div><div class="s">' + s + '</div></div>';
  $('stats').innerHTML = c('fa-user-group', 'Volunteers', vols.length, vols.filter(v => v.active).length + ' active')
    + c('fa-users', 'Presenters covered', sum('participants'), 'across all volunteers')
    + c('fa-display', 'PPTs available', sum('pptAvailable'), 'uploaded by presenters')
    + c('fa-download', 'PPTs downloaded', sum('downloaded'), sum('pptAvailable') ? Math.round(sum('downloaded') * 100 / sum('pptAvailable')) + '% of available' : '—');
  $('info').textContent = 'Showing ' + view.length + ' of ' + vols.length + ' volunteers';
  $('tb').innerHTML = view.length ? view.map(v => {
    const s = v.stats, o = open.has(String(v.id));
    let h = '<tr data-id="' + esc(v.id) + '" style="cursor:pointer;"><td><i class="fa-solid fa-chevron-' + (o ? 'down' : 'right') + '" style="font-size:11px;color:var(--text-3);"></i></td>'
      + '<td><span class="nm">' + esc(v.name) + '</span> ' + (v.active ? '' : '<span class="badge b-bad">Disabled</span>') + '<br><span class="id" style="font-size:12px;">' + esc(v.id) + '</span></td>'
      + '<td><div class="chips">' + (v.assignments.length ? v.assignments.map(a => '<span class="achip">' + esc(a.text) + '</span>').join('') : '<span class="tiny">Nothing assigned</span>') + '</div></td>'
      + '<td>' + s.participants + '</td><td>' + s.pptAvailable + ' / ' + s.participants + '</td><td>' + s.downloaded + ' / ' + s.pptAvailable + '</td><td>' + (s.lastDownload ? esc(when(s.lastDownload)) : '—') + '</td></tr>';
    if (o) h += '<tr class="dt"><td></td><td colspan="6"><div class="scroll-x"><table class="list"><thead><tr><th>VRMIC ID</th><th>Name</th><th>Category</th><th>Slot</th><th>PPT</th><th>Downloaded</th></tr></thead><tbody>'
      + (v.participants.map(p => '<tr><td class="id">' + esc(p.id) + '</td><td class="nm">' + esc(p.name) + '</td><td>' + esc(p.type) + '</td><td>' + esc(slotText(p) || '—') + '</td><td>' + pptTxt(p) + '</td><td>'
        + (p.downloadedAt ? '<span style="color:var(--teal-light);">' + esc(when(p.downloadedAt)) + '</span>' : '—') + '</td></tr>').join('') || '<tr><td class="empty" colspan="6">No presenters in scope yet.</td></tr>')
      + '</tbody></table></div></td></tr>';
    return h;
  }).join('') : '<tr><td class="empty" colspan="7">' + (vols.length ? 'No volunteers match.' : 'No volunteer accounts yet. Create one in Admin users with category Volunteer.') + '</td></tr>';
}
$('tb').onclick = e => { if (e.target.closest('a,button')) return; const tr = e.target.closest('tr[data-id]'); if (!tr) return; const k = tr.dataset.id; open.has(k) ? open.delete(k) : open.add(k); render(); };
$('q').addEventListener('input', render);

async function load() {
  $('tb').innerHTML = '<tr><td class="empty" colspan="7">Loading volunteers…</td></tr>';
  try {
    const r = await VR.api('adminListVolunteers', {});
    if (!r.ok) { $('tb').innerHTML = '<tr><td class="empty" colspan="7">Could not load.</td></tr>'; return showErr(r.error || 'Could not load volunteers.'); }
    vols = r.volunteers || []; render();
  } catch (e) { $('tb').innerHTML = '<tr><td class="empty" colspan="7">Could not load.</td></tr>'; showErr('Could not reach the server. Check your connection and try again.'); }
}
$('refresh').onclick = load;

// Export: one row per volunteer + presenter (a volunteer with nothing in scope still gets a row)
VR.exportBar($('xp'), { name: 'Volunteers', title: 'VRMIC 2026 — Volunteer report', imageEl: () => $('tc'), pdfOpts: { orientation: 'landscape' },
  getData: () => { const rows = [];
    view.forEach(v => { if (!v.participants.length) rows.push([v.id, v.name, v.active ? 'Active' : 'Disabled', '', '', '', '', '', '', '', '']);
      v.participants.forEach(p => rows.push([v.id, v.name, v.active ? 'Active' : 'Disabled', p.id, p.name, p.type, p.venue || '', p.room || '', p.date || '', p.time || '', pptTxt(p) + (p.downloadedAt ? ' · downloaded ' + when(p.downloadedAt) : '')])); });
    return { headers: ['Volunteer ID', 'Volunteer', 'Status', 'VRMIC ID', 'Presenter', 'Category', 'Venue', 'Room', 'Day', 'Time', 'PPT'], rows }; } });

load();
})();
</script>
</body>
</html>
