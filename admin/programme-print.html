<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printable Programme | LVRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.pg-grid{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start;}
@media (max-width:1000px){.pg-grid{grid-template-columns:1fr;}}
.pg-side{display:grid;gap:10px;}
.pg-side details{border:1px solid var(--navy-border);border-radius:12px;background:var(--navy-950);padding:0 12px;}
.pg-side summary{cursor:pointer;font-weight:700;padding:11px 0;color:var(--gold-light);font-size:13.5px;}
.pg-side details[open] summary{border-bottom:1px solid var(--navy-border);margin-bottom:10px;}
.pg-side .fld{margin-bottom:10px;} .pg-side label{font-size:12px;display:block;margin-bottom:3px;}
.pg-side textarea,.pg-side input[type=text],.pg-side input[type=number],.pg-side input[type=url],.pg-side select{width:100%;box-sizing:border-box;}
.pg-side textarea{min-height:58px;background:#0b1220;color:#fff;border:1px solid var(--navy-border);border-radius:8px;padding:8px;font:13px Inter,sans-serif;}
.pg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pg-side label.pg-chk{display:flex;font-size:13px;}
.pg-side input[type=color]{width:64px;height:30px;padding:0;}
.pg-chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0;} .pg-chk input{margin-top:3px;}
.pg-chk small{display:block;color:var(--text-3);font-size:11.5px;}
.lg-list{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;}
.lg-it{display:grid;grid-template-columns:22px 62px 1fr auto;gap:8px;align-items:center;border:1px solid var(--navy-border);border-radius:10px;padding:6px 8px;background:#0b1220;}
.lg-it.dragover{outline:2px dashed var(--gold);} .lg-it.off{opacity:.5;}
.lg-it .grip{cursor:grab;color:var(--text-3);background:none;border:0;padding:2px;}
.lg-th{height:44px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;} .lg-th img{max-width:100%;max-height:100%;}
.lg-th.bad::after{content:"No image";color:#b00020;font-size:10px;}
.lg-meta input{margin-bottom:4px;font-size:12px;padding:5px 7px;}
.lg-meta .r{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--text-3);} .lg-meta .r input{width:62px;margin:0;}
.lg-btns{display:flex;flex-direction:column;gap:3px;} .lg-btns button{padding:2px 7px;font-size:12px;}
.pg-prev{border:1px solid var(--navy-border);border-radius:12px;background:#6b7385;padding:14px;overflow:auto;max-height:calc(100vh - 150px);position:sticky;top:8px;}
.pg-paper{background:#fff;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.45);}
.pg-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;} .pg-bar .sp{flex:1;}
.pg-size{font:11.5px 'IBM Plex Mono',monospace;color:var(--text-3);}
.pg-size.bad{color:var(--danger,#e5646b);font-weight:700;}
.pg-note{font-size:12px;color:var(--text-3);margin:4px 0 0;}
</style>
</head>
<body>
<div class="topbar"><h1><i class="fa-solid fa-print" style="color:var(--gold-light);"></i> Printable programme</h1><a class="btn btn-sm" href="schedule-manage.html"><i class="fa-solid fa-calendar-days"></i> Schedule editor</a></div>
<div class="wrap" style="max-width:1400px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="pg-bar">
    <button class="btn btn-gold" id="b-pdf"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
    <button class="btn" id="b-print"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
    <span class="sp"></span><span class="pg-size" id="size"></span>
    <button class="btn" id="b-save"><i class="fa-solid fa-floppy-disk"></i> Save settings</button>
  </div>
  <div class="pg-grid">
    <div class="pg-side" id="side">
      <details open><summary><i class="fa-solid fa-images"></i> Logos</summary>
        <ul class="lg-list" id="lg-list"></ul>
        <div class="fld"><label for="lg-url">Add a logo by link</label><div style="display:flex;gap:6px;"><input type="url" id="lg-url" placeholder="https://…/logo.png"><button class="btn btn-sm" id="lg-add">Add</button></div></div>
        <div class="fld"><button class="btn btn-sm" id="lg-up"><i class="fa-solid fa-upload"></i> Upload a logo</button><input type="file" id="lg-file" accept="image/*" hidden>
          <button class="btn btn-sm" id="lg-reset"><i class="fa-solid fa-rotate-left"></i> Reset logos</button>
          <p class="pg-note">Uploaded images are shrunk and stored inside the settings. Links keep the settings small, but the image site must allow direct PDF download (print always works).</p></div>
        <div class="pg-row"><div class="fld"><label for="lg-align">Row alignment</label><select id="lg-align"><option value="center">Centre</option><option value="flex-start">Left</option><option value="flex-end">Right</option><option value="space-between">Spread out</option><option value="space-around">Spread evenly</option></select></div>
          <div class="fld"><label for="lg-gap">Gap (px)</label><input type="number" id="lg-gap" min="0" max="80"></div></div>
        <div class="fld"><label for="lg-all">Set every logo height (px)</label><div style="display:flex;gap:6px;"><input type="number" id="lg-all" min="20" max="160" value="64"><button class="btn btn-sm" id="lg-all-go">Apply</button></div></div>
      </details>
      <details open><summary><i class="fa-solid fa-heading"></i> Heading</summary>
        <div class="fld"><label for="h-title">Main title</label><input type="text" id="h-title"></div>
        <div class="fld"><label for="h-conf">Conference title (one line per row)</label><textarea id="h-conf"></textarea></div>
        <div class="fld"><label for="h-orglabel">Organiser label</label><input type="text" id="h-orglabel"></div>
        <div class="fld"><label for="h-org">Organiser lines</label><textarea id="h-org"></textarea></div>
        <div class="fld"><label for="h-color">Organiser colour</label><input type="color" id="h-color"></div>
        <label class="pg-chk"><input type="checkbox" id="h-showcollab"><span>Show the collaboration lines<small>Off by default. The 2024 wording is filled in, edit it for 2026.</small></span></label>
        <div class="fld"><label for="h-collabl">Collaboration label</label><input type="text" id="h-collabl"></div>
        <div class="fld"><label for="h-collab">Collaboration lines</label><textarea id="h-collab"></textarea></div>
      </details>
      <details open><summary><i class="fa-solid fa-list-check"></i> What to include</summary>
        <label class="pg-chk"><input type="checkbox" id="o-drafts"><span>Include draft days and sessions<small>Normally only published ones are printed.</small></span></label>
        <label class="pg-chk"><input type="checkbox" id="o-chairs"><span>Chair, co-chair and rapporteur lines</span></label>
        <label class="pg-chk"><input type="checkbox" id="o-judges"><span>Judges for oral and poster sessions</span></label>
        <label class="pg-chk"><input type="checkbox" id="o-pres"><span>Presenter lists for oral and poster sessions<small id="o-pres-n"></small></span></label>
        <label class="pg-chk"><input type="checkbox" id="o-guests"><span>Chief guest boxes in the ceremony</span></label>
        <label class="pg-chk"><input type="checkbox" id="o-gsum"><span>Chief guests list at the end</span></label>
        <label class="pg-chk"><input type="checkbox" id="o-venue"><span>Show the hall under a session when it differs from the day's venue</span></label>
        <label class="pg-chk"><input type="checkbox" id="o-break"><span>Start every day on a new page</span></label>
      </details>
      <details><summary><i class="fa-solid fa-sliders"></i> Page and style</summary>
        <div class="pg-row"><div class="fld"><label for="s-banner">Day banner colour</label><input type="color" id="s-banner"></div><div class="fld"><label for="s-font">Text size (px)</label><input type="number" id="s-font" min="9" max="16" step="0.5"></div></div>
        <div class="pg-row"><div class="fld"><label for="s-margin">Page margin (mm)</label><input type="number" id="s-margin" min="5" max="30"></div><div class="fld"><label for="s-face">Typeface</label><select id="s-face"><option value="serif">Times (as in 2024)</option><option value="sans">Arial</option></select></div></div>
        <div class="fld"><label for="f-text">Footer text</label><input type="text" id="f-text" maxlength="120"></div>
        <label class="pg-chk"><input type="checkbox" id="f-upd"><span>Add "Updated on" with today's date</span></label>
        <label class="pg-chk"><input type="checkbox" id="f-num"><span>Page numbers<small>Direct PDF only. When you print, your browser adds its own numbers.</small></span></label>
      </details>
      <button class="btn btn-sm" id="b-defaults"><i class="fa-solid fa-rotate-left"></i> Reset everything to the defaults</button>
    </div>
    <div class="pg-prev"><div class="pg-paper" id="paper"></div></div>
  </div>
</div>
<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!(VR.can('schedule', 'report') || VR.can('schedule', 'transaction'))) { VR.denied('You do not have permission to open the printable programme.'); return; }
const CAN_SAVE = VR.can('schedule', 'transaction'), CDN = 'https://cdnjs.cloudflare.com/ajax/libs/';
const $q = s => document.querySelector(s), $a = s => Array.from(document.querySelectorAll(s));
const clone = o => JSON.parse(JSON.stringify(o));
const BASE = 'https://lvrmic26.vercel.app/assets/', LOGO_NAMES = [['cimser-logo', 'CIMSER'], ['loyola-crest', 'Loyola College'], ['ahcf-logo', 'AHCF'], ['centenary-logo', 'Centenary'], ['iaes-logo', 'IAES']];
const defLogos = () => LOGO_NAMES.map((n, i) => ({ id: 'd' + i, src: BASE + n[0] + '.png', alt: n[1], show: true, h: 64 }));
const DEFAULTS = () => ({ v: 1, logos: defLogos(), logoAlign: 'center', logoGap: 22,
  head: { title: 'PROGRAMME SCHEDULE', confLines: ['3rd International Conference on', 'Emerging challenges in the prevention and control of', 'Vector-borne Diseases, 9th & 10th December 2024'], orgLabel: 'Organised by',
    orgLines: ['Centre for Insect Molecular Studies and Environmental Research (CIMSER)', 'PG & Research Department of Advanced Zoology and Biotechnology', 'Loyola College (Autonomous), Chennai – 34.'], orgColor: '#c2185b',
    showCollab: false, collabLabel: 'in collaboration with', collab: ['Absolute Human Care Foundation (AHCF), New Delhi'] },
  opts: { drafts: false, chairs: true, judges: true, presenters: false, guests: true, guestSummary: false, venue: true, pageBreakDay: true },
  style: { banner: '#d99694', font: 12, margin: 12, face: 'serif', footer: '', updated: true, pageNums: true } });
let S = null, cfg = DEFAULTS(), dirty = false, admins = {}, savedAt = '';
const ord = n => { const j = n % 10, k = n % 100; return n + (j === 1 && k !== 11 ? 'st' : j === 2 && k !== 12 ? 'nd' : j === 3 && k !== 13 ? 'rd' : 'th'); };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const longDate = iso => { const m = String(iso).match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? ord(+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : iso; };
const T = hm => hm ? hm12(hm).toLowerCase() : '';
const trange = (a, b) => (a ? T(a) : '') + (b ? ' – ' + T(b) : '');
const lines = v => String(v || '').split('\n').map(x => x.trim()).filter(Boolean);
const isBreak = t => t === 'tea' || t === 'lunch' || t === 'registration';
const nl = s => esc(s).replace(/\n/g, '<br>');

/* ---------- load ---------- */
(async function init() {
  let g, rl, c;
  try { [g, rl, c] = await Promise.all([VR.api('adminScheduleGet', {}), VR.api('adminScheduleRoles', {}), VR.api('adminScheduleGetConfig', {})]); } catch (e) { return showErr('Could not reach the server. Check your connection and reload.'); }
  if (!g.ok) return showErr(g.error || 'Could not load the schedule.');
  S = g; (rl.admins || []).forEach(a => admins[a.id] = a);
  if (c && c.ok && c.config) { const d = DEFAULTS(), s = c.config; cfg = { v: 1, logos: Array.isArray(s.logos) ? s.logos : d.logos, logoAlign: s.logoAlign || d.logoAlign, logoGap: s.logoGap != null ? s.logoGap : d.logoGap, head: Object.assign(d.head, s.head || {}), opts: Object.assign(d.opts, s.opts || {}), style: Object.assign(d.style, s.style || {}) }; savedAt = c.updatedAt; }
  else try { const st = await VR.settings(); if (st && st['conf.name']) cfg.head.confLines = lines(String(st['conf.name']).replace(/\s{2,}/g, '\n')); } catch (e) {}
  $q('#o-pres-n').textContent = S.slotsVisible ? '' : 'Participants cannot see presenter lists yet (slots are hidden in Settings). The printed copy will still list them.';
  if (!CAN_SAVE) $q('#b-save').style.display = 'none';
  bind(); fill(); draw();
})();

/* ---------- controls ---------- */
const TXT = [['h-title', 'head.title'], ['h-orglabel', 'head.orgLabel'], ['h-color', 'head.orgColor'], ['h-collabl', 'head.collabLabel'], ['s-banner', 'style.banner'], ['s-face', 'style.face'], ['f-text', 'style.footer'], ['lg-align', 'logoAlign']];
const NUM = [['s-font', 'style.font'], ['s-margin', 'style.margin'], ['lg-gap', 'logoGap']];
const CHK = [['h-showcollab', 'head.showCollab'], ['o-drafts', 'opts.drafts'], ['o-chairs', 'opts.chairs'], ['o-judges', 'opts.judges'], ['o-pres', 'opts.presenters'], ['o-guests', 'opts.guests'], ['o-gsum', 'opts.guestSummary'], ['o-venue', 'opts.venue'], ['o-break', 'opts.pageBreakDay'], ['f-upd', 'style.updated'], ['f-num', 'style.pageNums']];
const LNS = [['h-conf', 'head.confLines'], ['h-org', 'head.orgLines'], ['h-collab', 'head.collab']];
const get = p => p.split('.').reduce((o, k) => o[k], cfg);
const set = (p, v) => { const a = p.split('.'), k = a.pop(); a.reduce((o, x) => o[x], cfg)[k] = v; };
function fill() {
  TXT.concat(NUM).forEach(x => $q('#' + x[0]).value = get(x[1])); CHK.forEach(x => $q('#' + x[0]).checked = !!get(x[1])); LNS.forEach(x => $q('#' + x[0]).value = get(x[1]).join('\n'));
  drawLogos();
}
function bind() {
  let tm; const later = () => { clearTimeout(tm); tm = setTimeout(draw, 160); };
  const mark = () => { dirty = true; };
  TXT.forEach(x => $q('#' + x[0]).oninput = e => { set(x[1], e.target.value); mark(); later(); });
  NUM.forEach(x => $q('#' + x[0]).oninput = e => { const v = parseFloat(e.target.value); if (isFinite(v)) { set(x[1], v); mark(); later(); } });
  CHK.forEach(x => $q('#' + x[0]).onchange = e => { set(x[1], e.target.checked); mark(); draw(); });
  LNS.forEach(x => $q('#' + x[0]).oninput = e => { set(x[1], lines(e.target.value)); mark(); later(); });
  $q('#lg-add').onclick = () => { const u = $q('#lg-url').value.trim(); if (!/^https?:\/\/\S+$/i.test(u)) return showErr('Enter a full link starting with https://'); hideAlerts(); cfg.logos.push({ id: 'l' + Date.now(), src: u, alt: u.split('/').pop().replace(/\.[a-z]+$/i, '').slice(0, 40) || 'Logo', show: true, h: 64 }); $q('#lg-url').value = ''; mark(); drawLogos(); draw(); };
  $q('#lg-url').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $q('#lg-add').click(); } };
  $q('#lg-up').onclick = () => $q('#lg-file').click();
  $q('#lg-file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; hideAlerts(); try { const src = await shrink(f); cfg.logos.push({ id: 'u' + Date.now(), src: src, alt: f.name.replace(/\.[^.]+$/, '').slice(0, 40), show: true, h: 64 }); mark(); drawLogos(); draw(); } catch (er) { showErr(er.message || 'That image could not be read.'); } };
  $q('#lg-reset').onclick = () => { if (!confirm('Put the five standard logos back in their standard order? Your uploaded or added logos will be removed from the row.')) return; cfg.logos = defLogos(); mark(); drawLogos(); draw(); };
  $q('#lg-all-go').onclick = () => { const v = Math.max(20, Math.min(160, parseInt($q('#lg-all').value, 10) || 64)); cfg.logos.forEach(l => l.h = v); mark(); drawLogos(); draw(); };
  $q('#b-defaults').onclick = () => { if (!confirm('Reset every setting on this page to the defaults? Nothing is saved until you press Save settings.')) return; cfg = DEFAULTS(); mark(); fill(); draw(); };
  $q('#b-save').onclick = save; $q('#b-print').onclick = printIt; $q('#b-pdf').onclick = pdfIt;
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
}
// logo list with drag and drop, arrows, show/hide, height, remove
function drawLogos() {
  const ul = $q('#lg-list');
  ul.innerHTML = cfg.logos.map((l, i) => '<li class="lg-it' + (l.show ? '' : ' off') + '" draggable="true" data-i="' + i + '"><button class="grip" aria-label="Drag to reorder"><i class="fa-solid fa-grip-vertical"></i></button><div class="lg-th"><img src="' + esc(l.src) + '" alt=""></div><div class="lg-meta"><input type="text" data-k="alt" value="' + esc(l.alt) + '" aria-label="Logo name" maxlength="40"><div class="r"><label style="margin:0;"><input type="checkbox" data-k="show" ' + (l.show ? 'checked' : '') + '> Show</label> Height <input type="number" data-k="h" min="20" max="160" value="' + (+l.h || 64) + '"> px</div></div><div class="lg-btns"><button class="btn btn-sm" data-up aria-label="Move up">▲</button><button class="btn btn-sm" data-dn aria-label="Move down">▼</button><button class="btn btn-sm" data-rm aria-label="Remove logo"><i class="fa-solid fa-trash"></i></button></div></li>').join('') || '<li class="pg-note">No logos. Add one below.</li>';
  $a('.lg-th img').forEach(im => im.onerror = () => im.parentNode.classList.add('bad'));
  $a('.lg-it').forEach(li => {
    const i = +li.dataset.i, mv = (a, b) => { if (b < 0 || b >= cfg.logos.length) return; const x = cfg.logos.splice(a, 1)[0]; cfg.logos.splice(b, 0, x); dirty = true; drawLogos(); draw(); };
    li.querySelector('[data-up]').onclick = () => mv(i, i - 1); li.querySelector('[data-dn]').onclick = () => mv(i, i + 1);
    li.querySelector('[data-rm]').onclick = () => { cfg.logos.splice(i, 1); dirty = true; drawLogos(); draw(); };
    li.querySelectorAll('[data-k]').forEach(inp => inp.oninput = inp.onchange = () => { const k = inp.dataset.k; cfg.logos[i][k] = k === 'show' ? inp.checked : k === 'h' ? Math.max(20, Math.min(160, +inp.value || 64)) : inp.value; if (k === 'show') li.classList.toggle('off', !inp.checked); dirty = true; draw(); });
    li.ondragstart = e => { e.dataTransfer.setData('text/plain', String(i)); e.dataTransfer.effectAllowed = 'move'; li.dataset.drag = '1'; };
    li.ondragend = () => { delete li.dataset.drag; $a('.lg-it').forEach(x => x.classList.remove('dragover')); };
    li.ondragover = e => { e.preventDefault(); li.classList.add('dragover'); }; li.ondragleave = () => li.classList.remove('dragover');
    li.ondrop = e => { e.preventDefault(); const a = parseInt(e.dataTransfer.getData('text/plain'), 10); if (isFinite(a) && a !== i) mv(a, i); };
  });
}
// shrink an uploaded image so that it fits in the saved settings
function shrink(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Choose an image file (PNG, JPG, SVG or WebP).'));
    if (file.size > 8e6) return rej(new Error('That image is over 8 MB. Choose a smaller one.'));
    const fr = new FileReader(); fr.onerror = () => rej(new Error('That image could not be read.'));
    fr.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('That file is not a valid image.'));
      im.onload = () => { const tries = [[360, 'image/png'], [240, 'image/png'], [240, 'image/jpeg'], [160, 'image/jpeg']];
        for (const t of tries) { const sc = Math.min(1, t[0] / (im.naturalWidth || t[0])), c = document.createElement('canvas'); c.width = Math.max(1, Math.round((im.naturalWidth || t[0]) * sc)); c.height = Math.max(1, Math.round((im.naturalHeight || t[0]) * sc)); const x = c.getContext('2d'); if (t[1] === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); } x.drawImage(im, 0, 0, c.width, c.height); const d = c.toDataURL(t[1], 0.88); if (d.length <= 14000) return res(d); }
        rej(new Error('That image is too detailed to store. Use a simpler logo, or add it by link instead.')); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
async function save() {
  hideAlerts(); const len = JSON.stringify(cfg).length; if (len > 45000) return showErr('The settings are too large (' + len + ' of 45000 characters). Remove an uploaded logo or add it by link.');
  try { const r = await VR.api('adminScheduleSaveConfig', { config: cfg }); if (!r.ok) return showErr(r.error || 'Could not save.'); dirty = false; showOk('Settings saved. Every admin sees the same logos and options.'); } catch (e) { showErr('Could not reach the server. Your changes are still on this page.'); }
}

/* ---------- the document ---------- */
function visible(c) {
  const dayOk = d => c.opts.drafts || d.Status === 'Published', sesOk = s => c.opts.drafts || s.Status === 'Published';
  return S.days.filter(dayOk).map(d => ({ d: d, sess: S.sessions.filter(s => s.DayID === d.DayID && sesOk(s)) })).filter(x => x.sess.length || c.opts.drafts);
}
function docCss(c) {
  const st = c.style, ff = st.face === 'sans' ? 'Arial,Helvetica,sans-serif' : '"Times New Roman",Times,serif';
  return '.pp{font-family:' + ff + ';font-size:' + st.font + 'px;line-height:1.35;color:#000;background:#fff;box-sizing:border-box;}.pp *{box-sizing:border-box;}'
    + '.pp .lg{display:flex;justify-content:' + c.logoAlign + ';align-items:center;gap:' + c.logoGap + 'px;margin:0 0 8px;}.pp .lg img{width:auto;object-fit:contain;display:block;}'
    + '.pp .hd{text-align:center;margin-bottom:10px;}.pp .hd .t{font-weight:700;font-size:1.45em;letter-spacing:.02em;margin:4px 0;}.pp .hd .c{font-weight:700;font-size:1.12em;}.pp .hd .ol{font-weight:700;color:' + c.head.orgColor + ';}.pp .hd .org{font-weight:700;color:' + c.head.orgColor + ';}.pp .hd .co{font-weight:700;}'
    + '.pp table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 6px;}.pp th,.pp td{border:1px solid #000;padding:4px 7px;vertical-align:top;text-align:left;}.pp th{text-align:center;font-weight:700;}'
    + '.pp col.a{width:21%;}.pp tr{break-inside:avoid;page-break-inside:avoid;}.pp thead{display:table-header-group;}'
    + '.pp tr.day td{background:' + st.banner + ';text-align:center;font-weight:700;}.pp td.l{white-space:normal;}.pp td.ctr{text-align:center;}.pp .sn{font-weight:700;}.pp .sm{font-size:.88em;}'

    + '.pp .rl{margin-top:2px;}.pp .pl{margin:4px 0 0;padding-left:20px;font-size:.88em;}.pp .pl li{margin:1px 0;}.pp .dr{opacity:.6;}.pp .ft{margin-top:10px;font-size:.82em;color:#333;display:flex;justify-content:space-between;gap:12px;}'
    + '.pp .gs{margin-top:12px;}.pp .gs h3{font-size:1.05em;margin:0 0 4px;text-align:center;}.pp .gs td{border:1px solid #000;}';
}
function docHtml(c, forPdf) {

  h += '<div class="hd">' + (hd.title ? '<div class="t">' + esc(hd.title) + '</div>' : '') + hd.confLines.map(x => '<div class="c">' + esc(x) + '</div>').join('')
    + (hd.orgLabel || hd.orgLines.length ? '<div style="margin-top:6px;">' + (hd.orgLabel ? '<div class="ol">' + esc(hd.orgLabel) + '</div>' : '') + hd.orgLines.map(x => '<div class="org">' + esc(x) + '</div>').join('') + '</div>' : '')
    + (hd.showCollab && (hd.collab.length || hd.collabLabel) ? '<div style="margin-top:6px;">' + (hd.collabLabel ? '<div class="co">' + esc(hd.collabLabel) + '</div>' : '') + hd.collab.map(x => '<div class="co">' + esc(x) + '</div>').join('') + '</div>' : '') + '</div>';
  const vis = visible(c), head = '<colgroup><col class="a"><col></colgroup><thead><tr><th>Timing / Venue</th><th>Programme</th></tr></thead>';
  if (!vis.length) h += '<p style="text-align:center;margin:30px 0;">No published sessions yet.</p>';
  const groups = c.opts.pageBreakDay ? vis.map(x => [x]) : [vis];
  groups.forEach((g, gi) => { if (!g.length) return; h += '<table class="day-t" data-g="' + gi + '">' + head + '<tbody>'; g.forEach(x => h += dayRows(c, x.d, x.sess)); h += '</tbody></table>'; });
  if (c.opts.guestSummary) h += guestSummary(c, vis);
  const foot = [st.footer, st.updated ? 'Updated on ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : ''].filter(Boolean);
  if (foot.length && !forPdf) h += '<div class="ft"><span>' + esc(foot[0] || '') + '</span><span>' + esc(foot[1] || '') + '</span></div>';

}
function dayRows(c, d, sess) {
  let h = '<tr class="day"><td colspan="2">' + esc(d.Label || 'Day ' + d.DayNo) + ', Date : ' + esc(longDate(d.Date)) + (d.MainVenue ? ' &nbsp;&nbsp;&nbsp; Venue: ' + esc(d.MainVenue) : '') + (d.Status === 'Published' ? '' : ' (draft)') + '</td></tr>';
  sess.forEach(s => {
    const dr = (d.Status !== 'Published' || s.Status !== 'Published') ? ' dr' : '', its = S.items.filter(i => i.SessionID === s.SessionID), hall = s.Hall || d.MainVenue || '';
    if (isBreak(s.Type) && !its.length) { h += '<tr class="' + dr + '"><td>' + esc(trange(s.Start, s.End)) + '</td><td class="ctr">' + esc(s.Name) + '</td></tr>'; return; }
    const roles = [];
    if (c.opts.chairs) { if (s.Chair) roles.push('Chairperson: ' + s.Chair); if (s.CoChair) roles.push('Co-Chairperson: ' + s.CoChair); if (s.Rapporteur) roles.push('Rapporteur: ' + s.Rapporteur); }
    const js = c.opts.judges ? S.judges.filter(j => j.sessionId === s.SessionID).map(j => (admins[j.judgeId] || {}).name).filter(Boolean) : [];
    const where = c.opts.venue && hall && hall !== d.MainVenue ? 'Venue: ' + hall + (s.Room ? ' (' + s.Room + ')' : '') : (s.Room && hall === d.MainVenue ? 'Room: ' + s.Room : '');
    const timed = its.some(i => i.Start);
    h += '<tr class="' + dr + '"><td class="l"><span class="sn">' + (s.Number ? 'Session ' + esc(s.Number) : '') + '</span>' + (!timed ? '<div class="sm">' + esc(trange(s.Start, s.End)) + '</div>' : '') + '</td><td class="ctr"><b>' + esc(s.Name) + '</b>'
      + (roles.length ? '<div class="rl">' + roles.map(esc).join('&emsp;&emsp;') + '</div>' : '') + (js.length ? '<div class="rl">Judges: ' + esc(js.join(', ')) + '</div>' : '') + (where ? '<div class="sm">' + esc(where) + '</div>' : '') + (s.Description ? '<div class="sm">' + nl(s.Description) + '</div>' : '') + '</td></tr>';
    its.forEach(i => {
      const pl = c.opts.presenters && i.Presenters ? (S.presenters[i.ItemID] || []) : [];
      h += '<tr class="' + dr + '"><td>' + esc(trange(i.Start, i.End)) + '</td><td>'
        + (i.Speaker ? '<b>' + esc(i.Speaker) + '</b>' + (i.Affiliation ? ', ' + esc(i.Affiliation) : '') + '<br>' : '') + (i.Topic && !(!i.Speaker && i.Topic.trim().toLowerCase() === String(s.Name).trim().toLowerCase()) ? (i.Speaker ? 'Topic: ' + esc(i.Topic) : (i.Presenters || i.Type === 'ceremony' ? '' : '<b>') + esc(i.Topic) + (i.Presenters || i.Type === 'ceremony' ? '' : '</b>')) : '') + (i.Mode && i.Mode !== 'Physical' ? ' <i>(' + esc(i.Mode) + ')</i>' : '')
        + (i.Lines.length ? '<ul class="bl">' + i.Lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>' : '') + (c.opts.guests ? guestBoxes(i.Guests) : '')
        + (pl.length ? '<ol class="pl">' + pl.map(p => '<li>' + esc((p.time ? T(p.time) + ' · ' : '') + (p.token || p.board ? (p.token || p.board) + ' · ' : '') + p.name + (p.institution ? ', ' + p.institution : '') + (p.title ? ' — ' + p.title : '')) + '</li>').join('') + '</ol>' : '') + '</td></tr>';
    });
  });
  return h;
}
// consecutive guests with the same role share one box: CHIEF GUEST, then the names in red
function guestBoxes(gs) {
  if (!gs || !gs.length) return ''; const out = []; gs.forEach(g => { const r = String(g.role || '').trim().toUpperCase(), last = out[out.length - 1]; if (last && last.r === r) last.n.push(g.text); else out.push({ r: r, n: [g.text] }); });
  return out.map(b => '<div class="gb">' + (b.r ? '<div class="gr">' + esc(b.r) + '</div>' : '') + b.n.map(n => '<div class="gn">' + esc(n) + '</div>').join('') + '</div>').join('');
}
function guestSummary(c, vis) {
  const rows = []; vis.forEach(x => x.sess.forEach(s => S.items.filter(i => i.SessionID === s.SessionID).forEach(i => (i.Guests || []).forEach(g => rows.push([g.role || 'Guest', g.text, (x.d.Label || 'Day ' + x.d.DayNo)])))));
  if (!rows.length) return ''; return '<div class="gs"><h3>Chief guests and special guests</h3><table><colgroup><col class="a"><col></colgroup><tbody>' + rows.map(r => '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td></tr>').join('') + '</tbody></table></div>';
}
function draw() {
  if (!S) return; const len = JSON.stringify(cfg).length, el = $q('#size'); el.textContent = 'Settings size ' + len + ' / 45000'; el.className = 'pg-size' + (len > 45000 ? ' bad' : '');
  const w = Math.round((210 - 2 * cfg.style.margin) * 96 / 25.4), p = $q('#paper'); p.style.width = (w + 2 * Math.round(cfg.style.margin * 96 / 25.4)) + 'px'; p.style.padding = cfg.style.margin + 'mm';
  p.innerHTML = '<style>' + docCss(cfg) + '</style>' + docHtml(cfg, false);
  $a('#paper .lg img').forEach(im => im.onerror = () => { im.style.cssText += ';outline:2px dashed #b00020;min-width:60px;min-height:30px;'; im.alt = (im.alt || 'logo') + ' (could not load)'; });
}

/* ---------- print ---------- */
function printIt() {
  hideAlerts(); const m = cfg.style.margin, foot = [cfg.style.footer, cfg.style.updated ? 'Updated on ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : ''].filter(Boolean).join('  ·  ');
  const w = window.open('', '_blank'); if (!w) return showErr('Your browser blocked the print window. Allow pop-ups for this site and try again.');
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>LVRMIC 2026 – Programme</title><style>@page{size:A4;margin:' + m + 'mm ' + m + 'mm ' + (m + 5) + 'mm}html,body{margin:0;padding:0;background:#fff;}body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}'
    + docCss(cfg) + (cfg.opts.pageBreakDay ? '.pp table.day-t + table.day-t{break-before:page;page-break-before:always;}' : '') + '.pp .ft{display:none}.pf{position:fixed;left:0;right:0;bottom:0;font:10px Arial,sans-serif;color:#333;text-align:center;}</style></head><body>'
    + docHtml(cfg, true) + (foot ? '<div class="pf">' + esc(foot) + '</div>' : '') + '<script>window.onload=function(){setTimeout(function(){window.focus();window.print();},350);};<\/script></body></html>');
  w.document.close();
}

/* ---------- direct PDF ---------- */
const toData = src => new Promise((res, rej) => { if (/^data:/.test(src)) return res(src); fetch(src, { mode: 'cors' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); }).then(b => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = () => rej(new Error('read')); f.readAsDataURL(b); }).catch(rej); });
async function pdfIt() {
  hideAlerts(); const btn = $q('#b-pdf'), old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Building PDF…';
  let host;
  try {
    await VR.load(CDN + 'html2canvas/1.4.1/html2canvas.min.js'); await VR.load(CDN + 'jspdf/2.5.1/jspdf.umd.min.js');
    const c = clone(cfg), bad = [];
    for (const l of c.logos) if (l.show && l.src) { try { l.src = await toData(l.src); } catch (e) { bad.push(l.alt || l.src); } }
    if (bad.length) { showErr('The image site does not allow the direct PDF to include: ' + bad.join(', ') + '. Use Print / Save as PDF (it always works), or upload those logos instead of linking them.'); return; }
    const mm = 96 / 25.4, cw = Math.round((210 - 2 * c.style.margin) * mm), pageH = (297 - 2 * c.style.margin - 8) * mm;
    host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + cw + 'px;background:#fff;'; host.innerHTML = '<style>' + docCss(c) + '</style>' + docHtml(c, true); document.body.appendChild(host);
    await Promise.all(Array.from(host.querySelectorAll('img')).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const root = host.querySelector('.pp'); root.style.width = cw + 'px';
    const top0 = root.getBoundingClientRect().top, total = Math.ceil(root.scrollHeight);
    // places where a page may end: below any row, below the heading block, and a forced break above each new day
    const cuts = [], forced = [];
    root.querySelectorAll('tr').forEach(tr => cuts.push(tr.getBoundingClientRect().bottom - top0));
    const firstT = root.querySelector('table'); if (firstT) cuts.push(firstT.getBoundingClientRect().top - top0 - 1);
    if (c.opts.pageBreakDay) root.querySelectorAll('table.day-t').forEach((t, i) => { if (i > 0) forced.push(t.getBoundingClientRect().top - top0 - 2); });
    cuts.sort((a, b) => a - b);
    const scale = total * 2 > 28000 ? 1.2 : 2, canvas = await html2canvas(root, { backgroundColor: '#ffffff', scale: scale, useCORS: true, logging: false, windowWidth: cw });
    const pages = []; let start = 0;
    while (start < total - 1) {
      const limit = start + pageH; let end;
      const f = forced.filter(y => y > start + 4 && y <= limit)[0];
      if (f != null) end = f; else if (limit >= total) end = total; else { const ok = cuts.filter(y => y > start + 30 && y <= limit); end = ok.length ? ok[ok.length - 1] : limit; }
      pages.push([start, end]); start = end;
    }
    const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'pt', format: 'a4' }), mp = c.style.margin * 72 / 25.4, cwPt = 595.28 - 2 * mp, ratio = cwPt / cw;
    const foot = [c.style.footer, c.style.updated ? 'Updated on ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : ''].filter(Boolean).join('  |  ').replace(/[^\x20-\x7E]/g, '');
    pages.forEach((pg, n) => {
      if (n) doc.addPage();
      const sy = Math.round(pg[0] * scale), sh = Math.max(1, Math.min(canvas.height - sy, Math.round((pg[1] - pg[0]) * scale))), pc = document.createElement('canvas'); pc.width = canvas.width; pc.height = sh;
      const x = pc.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, pc.width, sh); x.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
      doc.addImage(pc.toDataURL('image/jpeg', 0.95), 'JPEG', mp, mp, cwPt, sh / scale * ratio);
      doc.setFontSize(8); doc.setTextColor(90);
      if (foot) doc.text(foot, mp, 841.89 - mp * 0.6);
      if (c.style.pageNums) doc.text('Page ' + (n + 1) + ' of ' + pages.length, 595.28 - mp, 841.89 - mp * 0.6, { align: 'right' });
    });
    doc.save('LVRMIC2026_programme.pdf'); showOk('PDF downloaded (' + pages.length + ' page' + (pages.length === 1 ? '' : 's') + ').');
  } catch (e) { showErr('The PDF could not be built' + (e && e.message ? ' (' + e.message + ')' : '') + '. Use Print / Save as PDF instead.'); }
  finally { if (host) host.remove(); btn.disabled = false; btn.innerHTML = old; }
}
