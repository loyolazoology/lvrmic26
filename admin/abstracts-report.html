<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abstract Status | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.t-Oral{background:rgba(31,122,104,.16);color:var(--teal-light);}
.t-Poster{background:rgba(205,163,85,.16);color:var(--gold-light);}
.a-Accepted{background:rgba(79,169,128,.14);color:var(--teal-light);}
.a-Submitted,.a-Revision{background:rgba(219,164,60,.14);color:var(--warn);}
.a-Rejected{background:rgba(216,105,90,.14);color:#e8988c;}
.a-Not{background:rgba(179,188,214,.1);color:var(--text-2);}
.x-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 22px;padding:6px 4px;}
.x-body div span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);}
.x-body div b{font-weight:500;color:var(--text-1);word-break:break-word;white-space:pre-wrap;}
.x-body .wide{grid-column:1/-1;}
table.list td.ti{white-space:normal;min-width:240px;max-width:420px;}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> Abstract status</h1><a class="btn btn-sm" id="rv" href="abstracts-review.html"><i class="fa-solid fa-file-circle-check"></i> Review queue</a></div>
<div class="wrap" style="max-width:1500px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search by name, VRMIC ID, title or document ID" autocomplete="off">
    <select id="ft"><option value="">All categories</option><option>Oral</option><option>Poster</option></select>
    <select id="fa"><option value="">All statuses</option><option>Not Submitted</option><option>Submitted</option><option>Accepted</option><option>Revision Requested</option><option>Rejected</option></select>
    <select id="fh"><option value="">All themes</option></select>
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <div id="xp" style="margin-left:auto;"></div>
  </div>

  <div class="table-card">
    <div class="tiny" id="info" style="padding:12px 16px 0;"></div>
    <div class="scroll-x" id="tc"><table class="list"><thead><tr><th style="width:26px;"></th><th>VRMIC ID</th><th>Name</th><th>Category</th><th>Doc ID</th><th>Title</th><th>Theme</th><th>Status</th><th>Version</th><th class="noprint">File</th></tr></thead>
      <tbody id="tb"><tr><td class="empty" colspan="10">Loading abstracts…</td></tr></tbody></table></div>
  </div>
  <p class="tiny noprint" style="margin-top:10px;">Click a row to see remarks, contact details and review dates. Only Oral and Poster participants have abstracts. Decisions are made in the <b>Review queue</b>.</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('abstract', 'report')) { VR.denied('You do not have permission to view the abstract report.'); return; }
if (!VR.can('abstract', 'transaction')) $('rv').style.display = 'none';

let all = [], view = [], open = new Set();
const abs = r => r.AbstractStatus || 'Not Submitted';
const aCls = s => 'a-' + String(s).split(' ')[0];
const url = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
const ver = r => Number(r.AbstractRevision) || (r.AbstractDocId ? 1 : 0);
const dt = v => v ? (String(v).length >= 10 ? fmtD(String(v).slice(0, 10)) : String(v)) : '';

function filtered() {
  const q = $('q').value.trim().toLowerCase(), t = $('ft').value, a = $('fa').value, h = $('fh').value;
  return all.filter(r => (r.ParticipantType === 'Oral' || r.ParticipantType === 'Poster')
    && (!q || [r.Name, r.ID, r.AbstractTitle, r.AbstractDocId].some(v => String(v || '').toLowerCase().indexOf(q) > -1))
    && (!t || r.ParticipantType === t) && (!a || abs(r) === a) && (!h || r.AbstractTheme === h));
}
const cell = (k, v, wide) => '<div' + (wide ? ' class="wide"' : '') + '><span>' + esc(k) + '</span><b>' + (v === '' || v == null ? '—' : esc(v)) + '</b></div>';

function render() {
  view = filtered();
  $('tb').innerHTML = view.length ? view.map(r => {
    const o = open.has(String(r.row)), link = url(r.AbstractLink);
    let h = '<tr data-row="' + esc(r.row) + '" style="cursor:pointer;"><td><i class="fa-solid fa-chevron-' + (o ? 'down' : 'right') + '" style="font-size:11px;color:var(--text-3);"></i></td>'
      + '<td class="id">' + esc(r.ID) + '</td><td class="nm">' + esc(r.Name) + '</td><td><span class="badge t-' + esc(r.ParticipantType) + '">' + esc(r.ParticipantType) + '</span></td>'
      + '<td style="font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;">' + esc(r.AbstractDocId || '—') + '</td><td class="ti">' + esc(r.AbstractTitle || '—') + '</td><td>' + esc(r.AbstractTheme || '—') + '</td>'
      + '<td><span class="badge ' + aCls(abs(r)) + '">' + esc(abs(r)) + '</span></td><td>' + (ver(r) ? 'v' + ver(r) : '—') + '</td>'
      + '<td class="noprint">' + (link ? '<a class="btn btn-sm" target="_blank" rel="noopener" href="' + esc(link) + '"><i class="fa-solid fa-arrow-up-right-from-square"></i> View</a>' : '—') + '</td></tr>';
    if (o) h += '<tr><td></td><td colspan="9" style="background:rgba(232,201,131,.04);"><div class="x-body">'
      + cell('Email', r.Email) + cell('Phone', r.Phone) + cell('Institution', r.Institution) + cell('Mode', r.Mode)
      + cell('Reviewed on', dt(r.AbstractReviewedAt)) + cell('Slot', [r.SlotVenue, r.SlotRoom, r.SlotDate, r.SlotTime].filter(Boolean).join(' · '))
      + cell('Reviewer remarks', r.AbstractRemarks, true) + '</div></td></tr>';
    return h;
  }).join('') : '<tr><td class="empty" colspan="10">' + (all.length ? 'No abstracts match these filters.' : 'No abstracts yet.') + '</td></tr>';
  $('info').textContent = 'Showing ' + view.length + ' Oral / Poster participants';
  stats();
}

function stats() {
  const n = s => view.filter(r => abs(r) === s).length;
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  const sub = view.length - n('Not Submitted');
  $('stats').innerHTML = c('fa-file-lines', 'Submitted', sub, 'of ' + view.length + ' Oral / Poster')
    + c('fa-hourglass-half', 'Awaiting review', n('Submitted'), n('Revision Requested') + ' revision requested')
    + c('fa-circle-check', 'Accepted', n('Accepted'), sub ? Math.round(n('Accepted') * 100 / sub) + '% of submitted' : '—')
    + c('fa-circle-xmark', 'Rejected · Not submitted', n('Rejected') + ' · ' + n('Not Submitted'), 'needs follow-up');
}

async function load() {
  $('tb').innerHTML = '<tr><td class="empty" colspan="10">Loading abstracts…</td></tr>';
  try {
    const r = await VR.api('adminListParticipants', {});
    if (!r.ok) { $('tb').innerHTML = '<tr><td class="empty" colspan="10">Could not load.</td></tr>'; return showErr(r.error || 'Could not load abstracts.'); }
    all = r.participants || [];
    const th = [...new Set(all.map(x => x.AbstractTheme).filter(Boolean))].sort();
    $('fh').innerHTML = '<option value="">All themes</option>' + th.map(x => '<option>' + esc(x) + '</option>').join('');
    render();
  } catch (e) { showErr('Could not reach the server. Check your connection and try again.'); }
}
$('q').addEventListener('input', render); ['ft', 'fa', 'fh'].forEach(i => $(i).addEventListener('change', render));
$('refresh').onclick = load;
$('tb').onclick = e => { if (e.target.closest('a,button')) return; const tr = e.target.closest('tr[data-row]'); if (!tr) return; const k = tr.dataset.row; open.has(k) ? open.delete(k) : open.add(k); render(); };

VR.exportBar($('xp'), { name: 'VRMIC2026_Abstracts', title: 'VRMIC 2026 — Abstract status', imageEl: () => $('tc'), pdfOpts: { orientation: 'landscape' },
  getData: () => ({ headers: ['VRMIC ID', 'Name', 'Category', 'Institution', 'Doc ID', 'Title', 'Theme', 'Status', 'Version', 'Remarks'],
    rows: view.map(r => [r.ID, r.Name, r.ParticipantType, r.Institution || '', r.AbstractDocId || '', r.AbstractTitle || '', r.AbstractTheme || '', abs(r), ver(r) || '', r.AbstractRemarks || '']) }) });

load();
})();
</script>
</body>
</html>
