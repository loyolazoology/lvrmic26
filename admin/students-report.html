<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student List &amp; QR Codes | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-qrcode" style="color:var(--gold-light);"></i> <span id="ttl">Student list &amp; QR codes</span></h1><div id="xp"></div></div>
<div class="wrap">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="banner noprint"><i class="fa-solid fa-circle-info"></i><div>Each QR code holds a <b>signed</b> ID (for example <span class="mono">VRMIC26-S001</span>), so a code that was not generated here is rejected by the scanner. Tick people to print only them; with nothing ticked, everyone in the current filter is printed.</div></div>
  <div class="toolbar noprint">
    <input id="q" placeholder="Search name, ID, class or department number…" autocomplete="off">
    <select id="fc" style="display:none;"><option value="">All classes</option></select>
    <select id="fs"><option value="">Active &amp; inactive</option><option value="1">Active only</option><option value="0">Inactive only</option></select>
    <select id="lay" title="QR tiles per A4 page"><option value="24">24 per page (3 × 8)</option><option value="12">12 per page (3 × 4)</option><option value="8">8 per page, large (2 × 4)</option></select>
    <button class="btn btn-gold" id="pdf"><i class="fa-solid fa-file-pdf"></i> QR sheet PDF</button>
    <button class="btn" id="prt"><i class="fa-solid fa-print"></i> Print QR sheet</button>
  </div>
  <div style="font-size:12.5px;color:var(--text-3);margin-bottom:8px;" id="count"></div>
  <div class="table-card" id="tc"><div class="scroll-x"><table class="list"><thead id="th"></thead><tbody id="tb"><tr><td class="empty" colspan="8"><span class="spinner"></span> Loading…</td></tr></tbody></table></div></div>
</div>

<div class="modal" id="qm"><div class="box" style="text-align:center;">
  <div id="q-img" style="display:inline-block;background:#fff;padding:12px;border-radius:10px;"></div>
  <h3 id="q-id" class="id" style="margin-top:14px;font-size:1.15rem;"></h3>
  <div id="q-name" class="nm"></div><div id="q-sub" style="font-size:12.5px;color:var(--text-3);"></div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;"><button class="btn btn-sm" id="q-dl"><i class="fa-solid fa-download"></i> Download PNG</button><button class="btn btn-sm" id="q-close">Close</button></div>
</div></div>

<div class="modal" id="em"><div class="box">
  <h3 style="margin-bottom:12px;"><i class="fa-solid fa-pen" style="color:var(--gold-light);"></i> Edit <span class="id" id="e-id"></span></h3>
  <div class="alert alert-error" id="e-err"></div>
  <label>Name</label><input id="e-name" maxlength="100"><div style="height:10px"></div>
  <label>Class</label><input id="e-class" maxlength="60"><div style="height:10px"></div>
  <label>Department number</label><input id="e-dept" maxlength="30"><div style="height:12px"></div>
  <label class="chk"><input type="checkbox" id="e-active"> Active (inactive students cannot be marked)</label>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;"><button class="btn" id="e-cancel">Cancel</button><button class="btn btn-gold" id="e-save">Save</button></div>
</div></div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
const kind = VR.kind(), isStudent = kind === 'student', MOD = isStudent ? 'students' : 'attendance';
if (!VR.can(MOD, 'report') && !VR.can(MOD, 'transaction')) { VR.denied('You do not have permission to view this page.'); return; }
$('ttl').textContent = isStudent ? 'Student list & QR codes' : 'Participant QR codes';
document.title = $('ttl').textContent + ' | VRMIC 2026 Admin';
const canEdit = isStudent && VR.can('students', 'transaction');
const QR_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', PDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const LAYOUTS = { 24: { cols: 3, rows: 8 }, 12: { cols: 3, rows: 4 }, 8: { cols: 2, rows: 4 } };
let all = [], shown = [], picked = new Set(), cur = null;
const cache = {};

const H = isStudent ? ['VRMIC ID', 'Name', 'Class', 'Department No.', 'Status'] : ['VRMIC ID', 'Name', 'Institution', 'Category', 'Mode', 'Status'];
const rowOf = p => isStudent ? [p.id, p.name, p.class, p.deptNo, p.active ? 'Active' : 'Inactive'] : [p.id, p.name, p.institution, p.type, p.mode, p.active ? 'Active' : 'Cancelled'];
const hay = p => [p.id, p.name, p.class, p.deptNo, p.institution].join(' ').toLowerCase();

async function qrImg(text, px) {
  const key = text + '|' + px; if (cache[key]) return cache[key];
  await VR.load(QR_URL);
  const d = document.createElement('div'); new QRCode(d, { text: text, width: px, height: px, correctLevel: QRCode.CorrectLevel.M });
  return (cache[key] = d.querySelector('canvas').toDataURL('image/png'));
}

function filter() {
  const q = $('q').value.trim().toLowerCase(), c = $('fc').value, s = $('fs').value;
  shown = all.filter(p => (!q || hay(p).includes(q)) && (!c || p.class === c) && (!s || (s === '1') === p.active));
  $('count').textContent = shown.length + ' of ' + all.length + ' shown' + (picked.size ? ' · ' + picked.size + ' ticked' : '');
  $('th').innerHTML = '<tr><th class="noprint"><input type="checkbox" id="all" style="width:auto;" title="Tick everyone shown"></th>' + H.map(h => '<th>' + h + '</th>').join('') + '<th class="noprint">QR</th>' + (canEdit ? '<th class="noprint"></th>' : '') + '</tr>';
  $('all').checked = shown.length > 0 && shown.every(p => picked.has(p.id));
  $('tb').innerHTML = shown.length ? shown.map(p => {
    const r = rowOf(p);
    return '<tr><td class="noprint"><input type="checkbox" data-pick="' + esc(p.id) + '" style="width:auto;"' + (picked.has(p.id) ? ' checked' : '') + '></td><td class="id">' + esc(r[0]) + '</td><td class="nm">' + esc(r[1]) + '</td>' +
      r.slice(2, -1).map(x => '<td>' + esc(x) + '</td>').join('') + '<td><span class="badge ' + (p.active ? 'b-ok' : 'b-neu') + '">' + esc(r[r.length - 1]) + '</span></td>' +
      '<td class="noprint"><button class="btn btn-sm" data-qr="' + esc(p.id) + '"><i class="fa-solid fa-qrcode"></i> Show</button></td>' +
      (canEdit ? '<td class="noprint"><button class="btn btn-sm" data-edit="' + esc(p.id) + '"><i class="fa-solid fa-pen"></i></button></td>' : '') + '</tr>';
  }).join('') : '<tr><td class="empty" colspan="9">' + (all.length ? 'No match.' : (isStudent ? 'No students yet. Add them under Students → Transaction → Student creation.' : 'No participants yet.')) + '</td></tr>';
  $('all').onchange = function () { shown.forEach(p => this.checked ? picked.add(p.id) : picked.delete(p.id)); filter(); };
}
async function load() {
  const r = await VR.api('adminQrList', { kind }); if (!r.ok) { showErr(r.error || 'Could not load the list.'); $('tb').innerHTML = ''; return; }
  all = r.people;
  if (isStudent) { const cl = [...new Set(all.map(p => p.class).filter(Boolean))].sort(); $('fc').style.display = ''; $('fc').innerHTML = '<option value="">All classes</option>' + cl.map(c => '<option>' + esc(c) + '</option>').join(''); }
  filter();
}
$('q').oninput = filter; $('fc').onchange = filter; $('fs').onchange = filter;
$('tb').onclick = async e => {
  const pk = e.target.closest('[data-pick]'), qr = e.target.closest('[data-qr]'), ed = e.target.closest('[data-edit]');
  if (pk) { pk.checked ? picked.add(pk.dataset.pick) : picked.delete(pk.dataset.pick); $('count').textContent = shown.length + ' of ' + all.length + ' shown' + (picked.size ? ' · ' + picked.size + ' ticked' : ''); }
  if (qr) { cur = all.find(p => p.id === qr.dataset.qr); $('q-img').innerHTML = '<img alt="QR code" width="240" height="240" src="' + await qrImg(cur.qr, 480) + '">';
    $('q-id').textContent = cur.id; $('q-name').textContent = cur.name; $('q-sub').textContent = isStudent ? cur.class + ' · Dept ' + cur.deptNo : (cur.institution || ''); $('qm').classList.add('show'); }
  if (ed) { cur = all.find(p => p.id === ed.dataset.edit); $('e-id').textContent = cur.id; $('e-name').value = cur.name; $('e-class').value = cur.class; $('e-dept').value = cur.deptNo; $('e-active').checked = cur.active; $('e-err').classList.remove('show'); $('em').classList.add('show'); }
};
$('q-close').onclick = () => $('qm').classList.remove('show');
$('q-dl').onclick = async () => { const a = document.createElement('a'); a.href = await qrImg(cur.qr, 600); a.download = 'QR_' + cur.id + '.png'; document.body.appendChild(a); a.click(); a.remove(); };
$('e-cancel').onclick = () => $('em').classList.remove('show');
$('e-save').onclick = function () {
  return VR.busy(this, 'Saving…', async () => {
    const r = await VR.api('adminUpdateStudent', { id: cur.id, name: $('e-name').value, class: $('e-class').value, deptNo: $('e-dept').value, active: $('e-active').checked });
    if (!r.ok) { $('e-err').textContent = r.error || 'Could not save.'; $('e-err').classList.add('show'); return; }
    $('em').classList.remove('show'); showOk('Saved.'); load();
  });
};

// ---------- QR sheet (A4) ----------
const chosen = () => { const l = picked.size ? all.filter(p => picked.has(p.id)) : shown; return l.filter(p => p.active); };
const lines = p => isStudent ? { a: p.id, b: p.name, c: p.class + ' · Dept ' + p.deptNo } : { a: p.id, b: p.name, c: p.institution || '' };
function needList() { const l = chosen(); if (!l.length) { showErr('There is nobody to print (inactive people are skipped).'); return null; } if (!picked.size && l.length > 60 && !confirm('Print QR codes for all ' + l.length + ' people shown?')) return null; hideAlerts(); return l; }

$('pdf').onclick = function () {
  const l = needList(); if (!l) return;
  const L = LAYOUTS[$('lay').value];
  return VR.busy(this, 'Building PDF…', async () => {
    await VR.load(PDF_URL);
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' }), M = 10, tw = (210 - 2 * M) / L.cols, th = (297 - 2 * M) / L.rows, per = L.cols * L.rows;
    const side = Math.min(tw - 12, th - 24), fs = th > 55 ? 12 : 9.5;
    for (let i = 0; i < l.length; i++) {
      if (i && i % per === 0) doc.addPage();
      const k = i % per, x = M + (k % L.cols) * tw, y = M + Math.floor(k / L.cols) * th, t = lines(l[i]);
      doc.setLineDashPattern([1.2, 1.2], 0); doc.setDrawColor(150); doc.setLineWidth(0.15); doc.rect(x, y, tw, th);   // cut guide
      doc.addImage(await qrImg(l[i].qr, 360), 'PNG', x + (tw - side) / 2, y + 3.5, side, side);
      let ty = y + 3.5 + side + 4.5;
      doc.setTextColor(0); doc.setFont('helvetica', 'bold'); doc.setFontSize(fs); doc.text(t.a, x + tw / 2, ty, { align: 'center' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(fs - 2.5);
      doc.splitTextToSize(t.b, tw - 6).slice(0, 2).forEach(s => { ty += (fs - 2.5) * 0.42; doc.text(s, x + tw / 2, ty, { align: 'center' }); });
      doc.setTextColor(90); ty += (fs - 2.5) * 0.42; doc.splitTextToSize(t.c, tw - 6).slice(0, 1).forEach(s => doc.text(s, x + tw / 2, ty, { align: 'center' }));
    }
    doc.save(VR.fileName((isStudent ? 'Student' : 'Participant') + '_QR_Sheet', 'pdf'));
  });
};
$('prt').onclick = function () {
  const l = needList(); if (!l) return;
  const L = LAYOUTS[$('lay').value], per = L.cols * L.rows, w = window.open('', '_blank'); if (!w) return showErr('Allow pop-ups to print.');
  return VR.busy(this, 'Preparing…', async () => {
    let pages = '';
    for (let i = 0; i < l.length; i += per) {
      let tiles = '';
      for (const p of l.slice(i, i + per)) { const t = lines(p); tiles += '<div class="t"><img src="' + await qrImg(p.qr, 360) + '"><b>' + esc(t.a) + '</b><span>' + esc(t.b) + '</span><i>' + esc(t.c) + '</i></div>'; }
      pages += '<div class="pg">' + tiles + '</div>';
    }
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>QR sheet</title><style>@page{size:A4;margin:10mm}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#000}.pg{display:grid;grid-template-columns:repeat(' + L.cols + ',1fr);grid-template-rows:repeat(' + L.rows + ',1fr);height:277mm;page-break-after:always}.pg:last-child{page-break-after:auto}.t{border:1px dashed #888;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2mm;overflow:hidden}.t img{width:' + (L.cols === 2 ? '48mm' : '30mm') + ';height:auto;max-height:70%}.t b{font-size:' + (L.rows === 4 ? '11pt' : '9.5pt') + ';margin-top:1.5mm;font-family:monospace}.t span{font-size:8.5pt;margin-top:.6mm;line-height:1.15}.t i{font-size:7.5pt;color:#555;font-style:normal;margin-top:.4mm}</style></head><body>' + pages + '</body></html>');
    w.document.close(); w.focus(); setTimeout(() => w.print(), 500);
  });
};

VR.exportBar($('xp'), { name: isStudent ? 'Students' : 'Participant_QR_List', title: $('ttl').textContent, imageEl: () => $('tc'), getData: () => ({ headers: H, rows: shown.map(rowOf) }) });
load();
})();
</script>
</body>
</html>
