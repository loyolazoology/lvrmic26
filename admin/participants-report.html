<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Participant List | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
/* badges */
.t-Oral{background:rgba(31,122,104,.16);color:var(--teal-light);}
.t-Poster{background:rgba(205,163,85,.16);color:var(--gold-light);}
.t-Participant{background:rgba(179,188,214,.1);color:var(--text-2);}
.a-Accepted{background:rgba(79,169,128,.14);color:var(--teal-light);}
.a-Submitted,.a-Revision{background:rgba(219,164,60,.14);color:var(--warn);}
.a-Rejected{background:rgba(216,105,90,.14);color:#e8988c;}
.a-Not{background:rgba(179,188,214,.1);color:var(--text-2);}

/* main table: one line per cell, except long text columns which wrap */
table.list td{white-space:nowrap;vertical-align:middle;}
table.list td.wrapc{white-space:normal;min-width:170px;max-width:260px;overflow-wrap:anywhere;line-height:1.4;}
table.list tr.main{cursor:pointer;}
table.list tr.detail td{white-space:normal;background:rgba(232,201,131,.04);padding:0;}

/* expanded record: stays inside the visible width, wraps long values */
.x-wrap{position:sticky;left:0;width:min(1100px,calc(100vw - 70px));padding:14px 16px 16px;white-space:normal;}
.x-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 26px;}
.x-body > div{min-width:0;}
.x-body > div > span{display:block;margin-bottom:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);}
.x-body > div > b{display:block;font-weight:500;color:var(--text-1);white-space:normal;overflow-wrap:anywhere;line-height:1.4;}
.x-body > div.span2{grid-column:span 2;}
@media(max-width:600px){.x-body > div.span2{grid-column:auto;}}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> Participant list</h1><a class="btn btn-sm" id="add" href="participants-manage.html"><i class="fa-solid fa-user-plus"></i> Add participant</a></div>
<div class="wrap" style="max-width:1500px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search by name, email, phone or VRMIC ID" autocomplete="off">
    <select id="ft"><option value="">All categories</option><option>Oral</option><option>Poster</option><option>Participant</option></select>
    <select id="fm"><option value="">All modes</option><option>Offline</option><option>Online</option></select>
    <select id="fa"><option value="">All abstract statuses</option><option>Not Submitted</option><option>Submitted</option><option>Accepted</option><option>Revision Requested</option><option>Rejected</option><option>Not Applicable</option></select>
    <select id="fr"><option value="">Any registration</option><option>Registered</option><option>Pending</option><option>Cancelled</option></select>
    <select id="fp"><option value="">Any profile</option><option value="y">Profile complete</option><option value="n">Profile incomplete</option></select>
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <div id="xp" style="margin-left:auto;"></div>
  </div>

  <div class="table-card">
    <div class="tiny" id="info" style="padding:12px 16px 0;"></div>
    <div class="scroll-x" id="tc"><table class="list" id="tbl"><thead><tr><th style="width:26px;"></th><th>VRMIC ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Institution</th><th>Category</th><th>Mode</th><th>Registration</th><th>Profile</th><th>Abstract</th><th>Created</th><th class="noprint"></th></tr></thead>
      <tbody id="tb"><tr><td class="empty" colspan="13">Loading participants…</td></tr></tbody></table></div>
  </div>
  <p class="tiny noprint" style="margin-top:10px;">Click a row to expand the full record. This is a view-only list; to change a participant, use <b>Participant details</b> (the pencil button on each row opens it).</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('participants', 'report')) { VR.denied('You do not have permission to view the participant list.'); return; }
const canEdit = VR.can('participants', 'transaction');
if (!canEdit) $('add').style.display = 'none';

let all = [], view = [], open = new Set();

const key = r => String(r.ID || r._row || r.row || '');
const abs = r => r.AbstractStatus || 'Not Submitted';
const aCls = s => 'a-' + String(s).split(' ')[0];
const created = r => r.CreatedAt ? fmtD(String(r.CreatedAt).slice(0, 10)) : '—';
const profile = r => String(r.ProfileCompleted).toUpperCase() === 'TRUE';
const reg = r => r.RegistrationStatus || 'Registered';
const paid = r => r.AmountPaid === '' || r.AmountPaid == null ? '—' : '₹' + r.AmountPaid;

function filtered() {
  const q = $('q').value.trim().toLowerCase(), t = $('ft').value, m = $('fm').value, a = $('fa').value, g = $('fr').value, p = $('fp').value;
  return all.filter(r => {
    if (q && ![r.Name, r.Email, r.ID, r.Phone, r.Institution].some(v => String(v || '').toLowerCase().indexOf(q) > -1)) return false;
    if (t && r.ParticipantType !== t) return false;
    if (m && r.Mode !== m) return false;
    if (a && abs(r) !== a) return false;
    if (g && reg(r) !== g) return false;
    if (p && (p === 'y') !== profile(r)) return false;
    return true;
  });
}

const cell = (k, v, wide) => '<div' + (wide ? ' class="span2"' : '') + '><span>' + esc(k) + '</span><b>' + (v === '' || v == null ? '—' : esc(v)) + '</b></div>';

function detail(r) {
  const online = r.Mode === 'Online';
  return '<tr class="detail"><td colspan="13"><div class="x-wrap"><div class="x-body">'
    + cell('Registration category', r.Role)
    + cell('Food preference', r.FoodPreference)
    + cell('Amount paid', paid(r))
    + cell('Fee paid', String(r.FeePaid).toUpperCase() === 'TRUE' ? 'Yes' : 'No')
    + cell('Registration date', r.RegistrationDate ? fmtD(String(r.RegistrationDate).slice(0, 10)) : '')
    + cell('Gender', r.Gender)
    + cell('City / State / Country', [r.City, r.State, r.Country].filter(Boolean).join(', '))
    + cell('Designation', r.Designation)
    + cell('Department', r.Department)
    + cell(online ? 'Meeting link' : 'Venue', online ? r.MeetingLink : r.Location, true)
    + cell('Abstract title', r.AbstractTitle, true)
    + cell('Abstract theme', r.AbstractTheme)
    + cell('Slot venue', r.SlotVenue)
    + '</div></div></td></tr>';
}

function render() {
  view = filtered();
  $('tb').innerHTML = view.length ? view.map(r => {
    const k = key(r), o = open.has(k);
    let h = '<tr class="main" data-row="' + esc(k) + '"><td><i class="fa-solid fa-chevron-' + (o ? 'down' : 'right') + '" style="font-size:11px;color:var(--text-3);"></i></td>'
      + '<td class="id">' + esc(r.ID) + '</td>'
      + '<td class="nm wrapc">' + esc(r.Name) + '</td>'
      + '<td>' + esc(r.Email) + '</td>'
      + '<td>' + esc(r.Phone) + '</td>'
      + '<td class="wrapc">' + esc(r.Institution) + '</td>'
      + '<td><span class="badge t-' + esc(r.ParticipantType || 'Participant') + '">' + esc(r.ParticipantType || '—') + '</span></td>'
      + '<td>' + esc(r.Mode || '—') + '</td>'
      + '<td>' + esc(reg(r)) + '</td>'
      + '<td>' + (profile(r) ? '<span class="badge s-Present">Complete</span>' : '<span class="badge s-Late">Incomplete</span>') + '</td>'
      + '<td><span class="badge ' + aCls(abs(r)) + '">' + esc(abs(r)) + '</span></td>'
      + '<td>' + esc(created(r)) + '</td>'
      + '<td class="noprint">' + (canEdit ? '<a class="btn btn-sm" title="Edit in Participant details" href="participants-details.html?id=' + encodeURIComponent(r.ID) + '"><i class="fa-solid fa-pen"></i></a> ' : '')
      + '<a class="btn btn-sm" title="Individual view" href="participants-individual.html?id=' + encodeURIComponent(r.ID) + '"><i class="fa-solid fa-id-card"></i></a></td></tr>';
    if (o) h += detail(r);
    return h;
  }).join('') : '<tr><td class="empty" colspan="13">' + (all.length ? 'No participants match these filters.' : 'No participants yet.') + '</td></tr>';
  $('info').textContent = 'Showing ' + view.length + ' of ' + all.length;
  stats();
}

function stats() {
  const n = f => view.filter(f).length;
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  $('stats').innerHTML = c('fa-users', 'Participants', view.length, 'of ' + all.length + ' in total')
    + c('fa-display', 'Oral · Poster', n(r => r.ParticipantType === 'Oral') + ' · ' + n(r => r.ParticipantType === 'Poster'), n(r => r.ParticipantType === 'Participant') + ' delegates only')
    + c('fa-location-dot', 'Offline · Online', n(r => r.Mode === 'Offline') + ' · ' + n(r => r.Mode === 'Online'), n(r => profile(r)) + ' profiles complete')
    + c('fa-file-circle-check', 'Abstracts accepted', n(r => abs(r) === 'Accepted'), n(r => abs(r) === 'Submitted') + ' awaiting review');
}

async function load() {
  hideAlerts();
  $('tb').innerHTML = '<tr><td class="empty" colspan="13">Loading participants…</td></tr>';
  try {
    const r = await VR.api('adminListParticipants', {});
    if (!r.ok) { showErr(r.error || 'Could not load participants.'); $('tb').innerHTML = '<tr><td class="empty" colspan="13">Could not load.</td></tr>'; return; }
    all = r.participants || []; render();
  } catch (e) {
    showErr('Could not reach the server. Check your connection and try again.');
    $('tb').innerHTML = '<tr><td class="empty" colspan="13">Could not load.</td></tr>';
  }
}

$('q').addEventListener('input', render);
['ft', 'fm', 'fa', 'fr', 'fp'].forEach(i => $(i).addEventListener('change', render));
$('refresh').onclick = load;
$('tb').onclick = e => {
  if (e.target.closest('a,button')) return;
  const tr = e.target.closest('tr.main'); if (!tr) return;
  const k = tr.dataset.row; open.has(k) ? open.delete(k) : open.add(k); render();
};

const HEAD = ['VRMIC ID', 'Name', 'Email', 'Phone', 'Institution', 'Category', 'Mode', 'Registration', 'Registration category', 'Food', 'Amount paid', 'Profile', 'Abstract', 'Created'];
VR.exportBar($('xp'), { name: 'VRMIC2026_Participants', title: 'VRMIC 2026 — Participant list', imageEl: () => $('tc'), pdfOpts: { orientation: 'landscape' },
  getData: () => ({ headers: HEAD, rows: view.map(r => [r.ID, r.Name, r.Email, r.Phone, r.Institution, r.ParticipantType || '', r.Mode || '', reg(r), r.Role || '', r.FoodPreference || '', r.AmountPaid === '' || r.AmountPaid == null ? '' : r.AmountPaid, profile(r) ? 'Complete' : 'Incomplete', abs(r), r.CreatedAt ? String(r.CreatedAt).slice(0, 10) : '']) }) });

load();
})();
</script>
</body>
</html>
