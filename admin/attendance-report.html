<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> <span id="ttl">Attendance report</span></h1><a class="btn btn-sm" id="toqr" href="#"><i class="fa-solid fa-qrcode"></i> QR codes</a></div>
<div class="wrap">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search name or ID" autocomplete="off">
    <select id="fcls" style="display:none;"></select>
    <select id="fsess"><option value="">All sessions</option></select>
    <select id="fst"><option value="">Any status</option><option>Present</option><option>Late</option><option>Absent</option><option>Missing exit</option></select>
    <select id="fpc"><option value="">Any attendance %</option><option value="lt75">Below 75%</option><option value="ge75">75% and above</option><option value="eq100">100%</option></select>
    <div id="xp" style="margin-left:auto;"></div>
  </div>

  <div class="table-card">
    <div class="tiny" id="info" style="padding:12px 16px 0;"></div>
    <div class="scroll-x" id="tc"><table class="list" id="tbl"><thead id="th"></thead><tbody id="tb"><tr><td class="empty">Loading…</td></tr></tbody></table></div>
  </div>
  <p class="tiny noprint" style="margin-top:10px;">Click a row to expand the in/out times for each session. Attendance % counts only sessions marked "counts toward %" that have already started; Present and Late both count as attended.</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
const kind = VR.kind(), isStudent = kind === 'student', MOD = isStudent ? 'studentAttendance' : 'attendance';
const label = isStudent ? 'Student' : 'Participant';
$('ttl').textContent = label + ' attendance report';
document.title = $('ttl').textContent + ' | VRMIC 2026 Admin';
$('toqr').href = 'students-report.html?kind=' + kind;
if (!VR.can(MOD, 'report')) { VR.denied('You do not have permission to view the attendance report.'); return; }

let data = null, view = [], open = new Set();
const cls = st => 's-' + String(st).replace(/\s.*$/, '');          // "Missing exit" -> s-Missing
const badge = st => st ? '<span class="badge ' + cls(st) + '">' + esc(st) + '</span>' : '<span class="tiny" style="display:inline;">—</span>';
const sessList = () => { const f = $('fsess').value; return data.sessions.filter(s => !f || s.id === f); };

async function boot() {
  const r = await VR.api('adminAttendanceReport', { kind });
  if (!r.ok) { showErr(r.error || 'Could not load the report.'); $('tb').innerHTML = '<tr><td class="empty">Could not load.</td></tr>'; return; }
  data = r;
  $('fsess').innerHTML = '<option value="">All sessions</option>' + r.sessions.map(s => '<option value="' + esc(s.id) + '">' + esc(s.title) + ' — ' + esc(fmtD(s.date)) + '</option>').join('');
  if (isStudent) {
    const cl = [...new Set(r.rows.map(x => x.class).filter(Boolean))].sort();
    $('fcls').innerHTML = '<option value="">All classes</option>' + cl.map(c => '<option>' + esc(c) + '</option>').join(''); $('fcls').style.display = '';
  }
  render();
}

function matches(p) {
  const t = $('q').value.trim().toLowerCase();
  if (t && String(p.id).toLowerCase().indexOf(t) < 0 && String(p.name).toLowerCase().indexOf(t) < 0) return false;
  if (isStudent && $('fcls').value && p.class !== $('fcls').value) return false;
  const st = $('fst').value, ss = sessList();
  if (st && !ss.some(s => (p.cells[s.id] || {}).status === st)) return false;
  const pc = $('fpc').value;
  if (pc === 'lt75' && !(p.percent !== null && p.percent < 75)) return false;
  if (pc === 'ge75' && !(p.percent !== null && p.percent >= 75)) return false;
  if (pc === 'eq100' && p.percent !== 100) return false;
  return true;
}

function render() {
  if (!data) return;
  const ss = sessList();
  view = data.rows.filter(matches);
  // header
  const sub = isStudent ? '<th>Class</th>' : '<th>Institution</th>';
  $('th').innerHTML = '<tr><th style="width:26px;"></th><th>ID</th><th>Name</th>' + sub + ss.map(s => '<th title="' + esc(s.title) + '">' + esc(s.title) + '<br><span style="text-transform:none;letter-spacing:0;">' + esc(fmtD(s.date)) + '</span></th>').join('') + '<th>Attended</th><th>%</th></tr>';
  const cols = 6 + ss.length;
  $('tb').innerHTML = view.length ? view.map(p => {
    const o = open.has(p.id);
    let h = '<tr data-id="' + esc(p.id) + '" style="cursor:pointer;"><td><i class="fa-solid fa-chevron-' + (o ? 'down' : 'right') + '" style="font-size:11px;color:var(--text-3);"></i></td><td class="id">' + esc(p.id) + '</td><td class="nm">' + esc(p.name) + '</td><td>' + esc(isStudent ? p.class : p.institution) + '</td>'
      + ss.map(s => '<td>' + badge((p.cells[s.id] || {}).status) + '</td>').join('')
      + '<td>' + p.attended + ' / ' + p.total + '</td><td><b>' + (p.percent === null ? '—' : p.percent + '%') + '</b></td></tr>';
    if (o) h += '<tr><td></td><td colspan="' + (cols - 1) + '" style="background:rgba(232,201,131,.04);"><div style="display:flex;gap:12px;flex-wrap:wrap;">' + ss.map(s => {
      const c = p.cells[s.id] || {};
      return '<div class="card" style="padding:10px 14px;min-width:190px;margin:0;"><div style="font-weight:600;color:var(--text-1);">' + esc(s.title) + '</div><div class="tiny" style="display:block;">' + esc(fmtD(s.date)) + '</div>'
        + '<div style="margin:6px 0;">' + badge(c.status) + '</div><div class="tiny" style="display:block;">In: ' + esc(c.in ? hm12(c.in) : '—') + ' · Out: ' + esc(c.out ? hm12(c.out) : '—') + (c.source ? '<br>Source: ' + esc(c.source) : '') + '</div></div>';
    }).join('') + '</div></td></tr>';
    return h;
  }).join('') : '<tr><td class="empty" colspan="' + cols + '">' + (data.rows.length ? 'No one matches these filters.' : 'No ' + label.toLowerCase() + 's found.') + '</td></tr>';
  stats(ss); $('info').textContent = 'Showing ' + view.length + ' of ' + data.rows.length + ' · as of ' + fmtD(data.today) + ' (IST)';
}

function stats(ss) {
  let pr = 0, la = 0, ab = 0, mi = 0;
  view.forEach(p => ss.forEach(s => { const st = (p.cells[s.id] || {}).status; if (st === 'Present') pr++; else if (st === 'Late') la++; else if (st === 'Absent') ab++; else if (st === 'Missing exit') mi++; }));
  const avg = view.filter(p => p.percent !== null);
  const a = avg.length ? Math.round(avg.reduce((t, p) => t + p.percent, 0) * 10 / avg.length) / 10 : null;
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  $('stats').innerHTML = c('fa-users', label + 's', view.length, data.sessions.length + ' session(s)') + c('fa-circle-check', 'Present + Late', pr + la, pr + ' on time · ' + la + ' late')
    + c('fa-circle-xmark', 'Absent', ab, mi ? mi + ' missing exit' : 'for sessions already started') + c('fa-percent', 'Average attendance', a === null ? '—' : a + '%', 'of the people shown');
}

['q', 'fcls', 'fsess', 'fst', 'fpc'].forEach(i => $(i).addEventListener(i === 'q' ? 'input' : 'change', render));
$('tb').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (!tr) return; const id = tr.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); };

function exportData() {
  const ss = sessList();
  const headers = ['ID', 'Name', isStudent ? 'Class' : 'Institution'].concat(ss.map(s => s.title + ' (' + fmtD(s.date) + ')')).concat(['Attended', 'Total', '%']);
  const rows = view.map(p => [p.id, p.name, isStudent ? p.class : p.institution].concat(ss.map(s => { const c = p.cells[s.id] || {}; return (c.status || '—') + (c.in ? ' · in ' + hm12(c.in) : '') + (c.out ? ' · out ' + hm12(c.out) : ''); })).concat([p.attended, p.total, p.percent === null ? '' : p.percent]));
  return { headers, rows };
}
VR.exportBar($('xp'), { name: label + '_Attendance_Report', title: label + ' attendance report', imageEl: () => $('tc'), getData: exportData,
  pdfOpts: { orientation: 'landscape' } });

boot();
})();
</script>
</body>
</html>
