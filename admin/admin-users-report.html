<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin User Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.mchip{display:inline-block;background:rgba(232,201,131,.08);border:1px solid var(--navy-border);color:var(--text-2);border-radius:6px;padding:2px 7px;font-size:11px;margin:0 4px 4px 0;white-space:nowrap;}
.mchip b{color:var(--gold-light);font-weight:600;}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;}
.stat{background:var(--navy-950);border:1px solid var(--navy-border);border-radius:10px;padding:8px 14px;font-size:12.5px;color:var(--text-2);}
.stat b{display:block;font-size:18px;color:var(--gold-light);font-family:'IBM Plex Mono',monospace;line-height:1.2;}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> Admin user report</h1><div id="xp"></div></div>
<div class="wrap" style="max-width:1400px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>

  <div class="stats noprint" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search by ID, name, position, phone or email" autocomplete="off">
    <select id="fc"><option value="">All categories</option><option>Admin</option><option>Staff</option><option>Volunteer</option><option>Official</option></select>
    <select id="fs"><option value="">Any status</option><option value="1">Active</option><option value="0">Disabled</option></select>
    <select id="fp"><option value="">Any photo status</option><option value="0">Photo missing</option><option value="1">Has photo</option></select>
    <select id="fn"><option value="">Any contact status</option><option value="0">No contact number</option><option value="1">Has contact number</option></select>
    <a href="admin-users-manage.html" class="btn btn-gold"><i class="fa-solid fa-user-shield"></i> Manage admins</a>
  </div>

  <div class="table-card"><div class="scroll-x" id="tc">
    <table class="list"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Contact no.</th><th>Position</th><th>Category</th><th>Venue</th><th>Photo</th><th>Status</th><th>Last login</th><th>Access</th><th>Created</th></tr></thead>
    <tbody id="ab"><tr><td class="empty" colspan="12">Loading admins…</td></tr></tbody></table>
  </div></div>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('adminUsers', 'report')) { VR.denied('You do not have permission to view the admin user report.'); return; }

/* every module the server knows: [key, label] */
const MODS = [
  ['participants', 'Participants'], ['spotRegistration', 'Spot registration'], ['abstract', 'Abstracts'], ['slot', 'Slots'], ['presentationAccess', 'Presentation access'],
  ['attendanceConfig', 'Participant attendance sessions'], ['attendance', 'Participant attendance'],
  ['students', 'Student master'], ['studentConfig', 'Student attendance sessions'], ['studentAttendance', 'Student attendance'],
  ['liveBoard', 'Live event board'], ['scoring', 'Scoring'], ['badges', 'Badges and ID cards'],
  ['certificates', 'Certificates'], ['receipts', 'Receipts'], ['feedback', 'Feedback'], ['schedule', 'Schedule'], ['announcements', 'Announcements'], ['mail', 'Mail'], ['volunteers', 'Volunteers'],
  ['settings', 'Settings'], ['adminUsers', 'Admin users'], ['auditLog', 'Audit log'], ['trash', 'Trash and backups']
];
const level = p => p.transaction && p.report ? 'Edit' : p.transaction ? 'Mark' : 'View';
function permSummary(perms) {
  perms = perms || {};
  const chips = MODS.map(m => { const p = perms[m[0]] || {}; return (p.transaction || p.report) ? '<span class="mchip">' + esc(m[1]) + ': <b>' + level(p) + '</b></span>' : ''; }).join('');
  return chips || '<span style="color:var(--text-3);">No access</span>';
}
const permText = perms => MODS.map(m => { const p = (perms || {})[m[0]] || {}; return (p.transaction || p.report) ? m[1] + ': ' + level(p) : ''; }).filter(Boolean).join('; ') || 'No access';
const fmtDate = s => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : ''; };
const fmtTime = s => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' }) : ''; };

let admins = [];
const v = id => $(id).value.trim();
const view = () => { const q = v('q').toLowerCase(), c = $('fc').value, s = $('fs').value, p = $('fp').value, n = $('fn').value;
  return admins.filter(a => (!q || [a.id, a.name, a.position, a.email, a.contactNo].some(x => String(x || '').toLowerCase().indexOf(q) > -1))
    && (!c || a.category === c) && (!s || (s === '1') === a.active) && (!p || (p === '1') === !!a.hasPhoto) && (!n || (n === '1') === !!a.contactNo)); };

function render() {
  const list = view();
  $('stats').innerHTML = [['Accounts', admins.length], ['Active', admins.filter(a => a.active).length], ['Photo missing', admins.filter(a => !a.hasPhoto).length], ['No contact no.', admins.filter(a => !a.contactNo).length]]
    .map(x => '<div class="stat"><b>' + x[1] + '</b>' + x[0] + '</div>').join('');
  $('ab').innerHTML = list.length ? list.map(a => '<tr>'
    + '<td class="id">' + esc(a.id) + '</td><td><span class="nm">' + esc(a.name) + '</span></td><td>' + esc(a.email || '—') + '</td><td>' + esc(a.contactNo || '—') + '</td>'
    + '<td>' + esc(a.position || '—') + '</td><td>' + esc(a.category || '—') + '</td><td>' + esc(a.assignedVenue || '—') + '</td>'
    + '<td>' + (a.hasPhoto ? '<span class="badge s-Present">Yes</span>' : '<span class="badge s-Absent">Missing</span>') + '</td>'
    + '<td>' + (a.active ? '<span class="badge s-Present">Active</span>' : '<span class="badge s-Absent">Disabled</span>') + '</td>'
    + '<td>' + (a.lastLoginAt ? esc(fmtTime(a.lastLoginAt)) + (a.lastLoginIP ? '<span class="tiny">IP ' + esc(a.lastLoginIP) + '</span>' : '') : '—') + '</td>'
    + '<td style="max-width:380px;">' + permSummary(a.permissions) + '</td><td>' + esc(fmtDate(a.createdAt) || '—') + '</td></tr>').join('')
    : '<tr><td class="empty" colspan="12">' + (admins.length ? 'No admins match.' : 'No admin accounts yet.') + '</td></tr>';
}
async function load() {
  try {
    const r = await VR.api('adminListAdminUsers', {});
    if (!r.ok) { showErr(r.error || 'Could not load admins.'); $('ab').innerHTML = '<tr><td class="empty" colspan="12">No data</td></tr>'; return; }
    admins = r.admins || []; render();
  } catch (e) { showErr('Could not reach the server.'); }
}
$('q').addEventListener('input', render); ['fc', 'fs', 'fp', 'fn'].forEach(i => $(i).addEventListener('change', render));

VR.exportBar($('xp'), { name: 'VRMIC2026_Admin_User_Report', title: 'VRMIC 2026 — Admin user report', imageEl: () => $('tc'), pdfOpts: { orientation: 'landscape' },
  getData: () => ({ headers: ['ID', 'Name', 'Email', 'Contact no.', 'Position', 'Category', 'Venue', 'Photo', 'Status', 'Last login', 'Access', 'Created'],
    rows: view().map(a => [a.id, a.name, a.email || '', a.contactNo || '', a.position || '', a.category || '', a.assignedVenue || '', a.hasPhoto ? 'Yes' : 'Missing', a.active ? 'Active' : 'Disabled', fmtTime(a.lastLoginAt), permText(a.permissions), fmtDate(a.createdAt)]) }) });

load();
})();
</script>
</body>
</html>
