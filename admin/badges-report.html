<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Received Report | LVRMIC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>.yes{color:var(--teal-light);font-weight:600;}.no{color:var(--text-3);}</style>
</head>
<body>
<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> ID card &amp; kit received report</h1><span id="xp"></span></div>
<div class="wrap" style="max-width:1500px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar noprint">
    <input id="q" placeholder="Search by name, ID or organisation" autocomplete="off">
    <select id="fg"><option value="">All groups</option><option value="participant">Participants</option><option value="student">Students</option><option value="team">Volunteers / staff</option></select>
    <select id="fc"><option value="">All categories</option></select>
    <select id="fi"><option value="">Any item</option></select>
    <select id="fs"><option value="">All</option><option value="r">Received</option><option value="n">Not received</option></select>
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
  </div>
  <div class="table-card">
    <div class="tiny" id="info" style="padding:12px 16px 0;"></div>
    <div class="scroll-x" id="tc"><table class="list"><thead id="th"></thead><tbody id="tb"><tr><td class="empty">Loading…</td></tr></tbody></table></div>
  </div>
  <p class="tiny noprint" style="margin-top:10px;">Everyone is listed, received or not. "—" means that item is not issued to that group (see Received items setup).</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('badges', 'report') && !VR.can('badges', 'transaction') && !VR.can('spotRegistration', 'report') && !VR.can('spotRegistration', 'transaction')) { VR.denied('You do not have permission to view this report.'); return; }
const GN = { participant: 'Participant', student: 'Student', team: 'Volunteer / staff' };
const dtm = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true }); };
let all = [], cfg = { items: [] }, view = [];
const its = () => cfg.items.filter(i => i.active);
const app = (p, i) => !!(i.groups && i.groups[p.group]);

function filtered() {
  const q = $('q').value.trim().toLowerCase(), g = $('fg').value, c = $('fc').value, fi = $('fi').value, s = $('fs').value;
  return all.filter(p => {
    if (q && ![p.name, p.id, p.org].some(v => String(v || '').toLowerCase().indexOf(q) > -1)) return false;
    if (g && p.group !== g) return false; if (c && p.category !== c) return false;
    if (!s) return fi ? app(p, its().find(i => i.key === fi) || { groups: {} }) : true;
    const list = its().filter(i => app(p, i) && (!fi || i.key === fi));
    if (!list.length) return false;
    return s === 'r' ? list.every(i => p.rec[i.key]) : list.some(i => !p.rec[i.key]);
  });
}
function cell(p, i) {
  if (!app(p, i)) return '<span class="no">—</span>';
  const r = p.rec[i.key];
  return r ? '<span class="yes"><i class="fa-solid fa-circle-check"></i> Received</span><div class="tiny">' + esc(dtm(r.at)) + ' · ' + esc(r.by) + '</div>' : '<span class="no">Not received</span>';
}
function render() {
  view = filtered(); const cols = its();
  $('th').innerHTML = '<tr><th>ID</th><th>Name</th><th>Group</th><th>Category</th>' + cols.map(i => '<th>' + esc(i.label) + '</th>').join('') + '</tr>';
  $('tb').innerHTML = view.length ? view.map(p => '<tr><td class="id">' + esc(p.id) + '</td><td class="nm">' + esc(p.name) + '<div class="tiny">' + esc(p.org) + '</div></td><td>' + esc(GN[p.group]) + '</td><td>' + esc(p.category) + '</td>' + cols.map(i => '<td>' + cell(p, i) + '</td>').join('') + '</tr>').join('')
    : '<tr><td class="empty" colspan="' + (4 + cols.length) + '">' + (all.length ? 'Nobody matches these filters.' : 'No people found.') + '</td></tr>';
  $('info').textContent = 'Showing ' + view.length + ' of ' + all.length + ' people';
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  $('stats').innerHTML = c('fa-users', 'People', view.length, 'in this selection') + cols.map(i => { const a = view.filter(p => app(p, i)), r = a.filter(p => p.rec[i.key]).length; return c('fa-hand-holding', esc(i.label), r + ' / ' + a.length, (a.length - r) + ' pending'); }).join('');
}
function fill() {
  const g = $('fg').value, cur = $('fc').value;
  $('fc').innerHTML = '<option value="">All categories</option>' + [...new Set(all.filter(p => !g || p.group === g).map(p => p.category))].sort().map(x => '<option>' + esc(x) + '</option>').join('');
  $('fc').value = [...$('fc').options].some(o => o.value === cur) ? cur : '';
}
async function load() {
  $('tb').innerHTML = '<tr><td class="empty">Loading…</td></tr>';
  try {
    const r = await VR.api('adminBadgeRegister', {});
    if (!r.ok) { $('tb').innerHTML = '<tr><td class="empty">Could not load.</td></tr>'; return showErr(r.error || 'Could not load the report.'); }
    all = r.people || []; cfg = r.config || cfg;
    const fi = $('fi').value; $('fi').innerHTML = '<option value="">Any item</option>' + its().map(i => '<option value="' + esc(i.key) + '">' + esc(i.label) + '</option>').join(''); $('fi').value = fi;
    fill(); render();
  } catch (e) { showErr('Could not reach the server. Check your connection and try again.'); }
}
$('fg').addEventListener('change', () => { fill(); render(); });
['fc', 'fi', 'fs'].forEach(i => $(i).addEventListener('change', render)); $('q').addEventListener('input', render); $('refresh').onclick = load;
VR.exportBar($('xp'), { name: 'Received_Report', title: 'LVRMIC 2026 — ID card & conference kit received report', imageEl: () => $('tc'), pdfOpts: { orientation: 'landscape' },
  getData: () => { const cols = its(); return { headers: ['ID', 'Name', 'Group', 'Category', 'Organisation'].concat(...cols.map(i => [i.label, i.label + ' at', i.label + ' by'])),
    rows: view.map(p => [p.id, p.name, GN[p.group], p.category, p.org].concat(...cols.map(i => !app(p, i) ? ['n/a', '', ''] : p.rec[i.key] ? ['Yes', dtm(p.rec[i.key].at), p.rec[i.key].by] : ['No', '', '']))) }; } });
load();
})();
</script>
</body>
</html>
