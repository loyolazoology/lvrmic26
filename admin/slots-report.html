<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.t-Oral{background:rgba(31,122,104,.16);color:var(--teal-light);}
.t-Poster{background:rgba(205,163,85,.16);color:var(--gold-light);}
.a-Accepted{background:rgba(79,169,128,.14);color:var(--teal-light);}
.a-Submitted,.a-Revision{background:rgba(219,164,60,.14);color:var(--warn);}
.a-Rejected{background:rgba(216,105,90,.14);color:#e8988c;}
.a-Not{background:rgba(179,188,214,.1);color:var(--text-2);}
.x-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 22px;padding:6px 4px;}
.x-body div span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);}
.x-body div b{font-weight:500;color:var(--text-1);word-break:break-word;}
.x-body .wide{grid-column:1/-1;}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> Slot report</h1><a class="btn btn-sm" id="al" href="slots-manage.html"><i class="fa-solid fa-location-crosshairs"></i> Allot slots</a></div>
<div class="wrap" style="max-width:1450px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search by name, VRMIC ID, venue or token" autocomplete="off">
    <select id="ft"><option value="">All categories</option><option>Oral</option><option>Poster</option></select>
    <select id="fd"><option value="">All days</option></select>
    <select id="fv"><option value="">All venues</option></select>
    <select id="fs"><option value="">Allotted and pending</option><option value="set">Allotted</option><option value="unset">Pending</option></select>
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <div id="xp" style="margin-left:auto;"></div>
  </div>

  <div class="table-card">
    <div class="tiny" id="info" style="padding:12px 16px 0;"></div>
    <div class="scroll-x" id="tc"><table class="list"><thead><tr><th style="width:26px;"></th><th>VRMIC ID</th><th>Name</th><th>Category</th><th>Venue</th><th>Room</th><th>Day</th><th>Time</th><th>Token</th><th>Abstract</th></tr></thead>
      <tbody id="tb"><tr><td class="empty" colspan="10">Loading slots…</td></tr></tbody></table></div>
  </div>
  <p class="tiny noprint" style="margin-top:10px;">Sorted by day, venue, time, then token. Click a row for the abstract title, contact details and map link. To change a slot, use <b>Allot slots</b>.</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('slot', 'report')) { VR.denied('You do not have permission to view the slot report.'); return; }
if (!VR.can('slot', 'transaction')) $('al').style.display = 'none';

let all = [], view = [], open = new Set(), days = [];
const nz = v => String(v == null ? '' : v).trim();
const aCls = s => 'a-' + String(s || 'Not').split(' ')[0];
const url = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
function mins(t) {   // "10:30 AM", "2.15 pm", "14:00" -> minutes; unknown times sort last
  const m = String(t || '').match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm)?/i); if (!m) return 99999;
  let h = +m[1]; const ap = (m[3] || '').toLowerCase();
  if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;
  return h * 60 + +m[2];
}
const dayIdx = d => { const i = days.indexOf(d); return i < 0 ? (d ? 500 : 900) : i; };
const cmp = (a, b) => dayIdx(a.SlotDate) - dayIdx(b.SlotDate) || nz(a.SlotVenue).localeCompare(nz(b.SlotVenue)) || mins(a.SlotTime) - mins(b.SlotTime) || nz(a.SlotToken).localeCompare(nz(b.SlotToken), undefined, { numeric: true });
const cell = (k, v, wide) => '<div' + (wide ? ' class="wide"' : '') + '><span>' + esc(k) + '</span><b>' + (v === '' || v == null ? '—' : esc(v)) + '</b></div>';

function filtered() {
  const q = $('q').value.trim().toLowerCase(), t = $('ft').value, d = $('fd').value, v = $('fv').value, s = $('fs').value;
  return all.filter(r => (r.ParticipantType === 'Oral' || r.ParticipantType === 'Poster')
    && (!q || [r.Name, r.ID, r.SlotVenue, r.SlotToken].some(x => String(x || '').toLowerCase().indexOf(q) > -1))
    && (!t || r.ParticipantType === t) && (!d || r.SlotDate === d) && (!v || r.SlotVenue === v) && (!s || (s === 'set') === !!r.SlotVenue)).sort(cmp);
}
function render() {
  view = filtered();
  $('tb').innerHTML = view.length ? view.map(r => {
    const o = open.has(String(r.row)), map = url(r.SlotMapUrl);
    let h = '<tr data-row="' + esc(r.row) + '" style="cursor:pointer;"><td><i class="fa-solid fa-chevron-' + (o ? 'down' : 'right') + '" style="font-size:11px;color:var(--text-3);"></i></td>'
      + '<td class="id">' + esc(r.ID) + '</td><td class="nm">' + esc(r.Name) + '</td><td><span class="badge t-' + esc(r.ParticipantType) + '">' + esc(r.ParticipantType) + '</span></td>'
      + '<td>' + (r.SlotVenue ? esc(r.SlotVenue) : '<span class="badge s-Late">Pending</span>') + '</td><td>' + esc(r.SlotRoom || '—') + '</td><td>' + esc(r.SlotDate || '—') + '</td><td>' + esc(r.SlotTime || '—') + '</td>'
      + '<td class="id" style="color:var(--text-2);">' + esc(r.SlotToken || '—') + '</td><td><span class="badge ' + aCls(r.AbstractStatus) + '">' + esc(r.AbstractStatus || 'Not Submitted') + '</span></td></tr>';
    if (o) h += '<tr><td></td><td colspan="9" style="background:rgba(232,201,131,.04);"><div class="x-body">'
      + cell('Abstract title', r.AbstractTitle, true) + cell('Institution', r.Institution) + cell('Email', r.Email) + cell('Phone', r.Phone) + cell('Mode', r.Mode)
      + '<div><span>Map</span><b>' + (map ? '<a target="_blank" rel="noopener" href="' + esc(map) + '"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open map</a>' : 'Auto-generated') + '</b></div></div></td></tr>';
    return h;
  }).join('') : '<tr><td class="empty" colspan="10">' + (all.length ? 'No slots match these filters.' : 'No presenters yet.') + '</td></tr>';
  $('info').textContent = 'Showing ' + view.length + ' Oral / Poster participants';
  stats();
}
function stats() {
  const set = view.filter(r => r.SlotVenue).length, acc = view.filter(r => r.AbstractStatus === 'Accepted');
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  $('stats').innerHTML = c('fa-users', 'Presenters shown', view.length, view.filter(r => r.ParticipantType === 'Oral').length + ' Oral · ' + view.filter(r => r.ParticipantType === 'Poster').length + ' Poster')
    + c('fa-location-dot', 'Slot allotted', set, view.length ? Math.round(set * 100 / view.length) + '%' : '—') + c('fa-hourglass-half', 'Pending', view.length - set, acc.filter(r => !r.SlotVenue).length + ' of them already accepted')
    + c('fa-building', 'Venues', new Set(view.map(r => r.SlotVenue).filter(Boolean)).size, 'in use');
}
async function load() {
  $('tb').innerHTML = '<tr><td class="empty" colspan="10">Loading slots…</td></tr>';
  try {
    const r = await VR.api('adminListParticipants', {});
    if (!r.ok) { $('tb').innerHTML = '<tr><td class="empty" colspan="10">Could not load.</td></tr>'; return showErr(r.error || 'Could not load slots.'); }
    all = r.participants || [];
    const cd = $('fd').value, cv = $('fv').value;
    const used = [...new Set(all.map(x => nz(x.SlotDate)).filter(Boolean))], dl = days.concat(used.filter(x => days.indexOf(x) < 0));
    $('fd').innerHTML = '<option value="">All days</option>' + dl.map(x => '<option>' + esc(x) + '</option>').join(''); $('fd').value = cd;
    $('fv').innerHTML = '<option value="">All venues</option>' + [...new Set(all.map(x => nz(x.SlotVenue)).filter(Boolean))].sort().map(x => '<option>' + esc(x) + '</option>').join(''); $('fv').value = cv;
    render();
  } catch (e) { showErr('Could not reach the server. Check your connection and try again.'); }
}
$('q').addEventListener('input', render); ['ft', 'fd', 'fv', 'fs'].forEach(i => $(i).addEventListener('change', render)); $('refresh').onclick = load;
$('tb').onclick = e => { if (e.target.closest('a,button')) return; const tr = e.target.closest('tr[data-row]'); if (!tr) return; const k = tr.dataset.row; open.has(k) ? open.delete(k) : open.add(k); render(); };

VR.exportBar($('xp'), { name: 'VRMIC2026_Slots', title: 'VRMIC 2026 — Slot report', imageEl: () => $('tc'), pdfOpts: { orientation: 'landscape' },
  getData: () => ({ headers: ['VRMIC ID', 'Name', 'Category', 'Institution', 'Venue', 'Room', 'Day', 'Time', 'Token', 'Abstract status'],
    rows: view.map(r => [r.ID, r.Name, r.ParticipantType, r.Institution || '', r.SlotVenue || '', r.SlotRoom || '', r.SlotDate || '', r.SlotTime || '', r.SlotToken || '', r.AbstractStatus || 'Not Submitted']) }) });

(async () => { try { days = await VR.confDays(); } catch (e) { days = []; } if (!days.length) days = ['26 Nov 2026', '27 Nov 2026', '28 Nov 2026']; load(); })();
})();
</script>
</body>
</html>
