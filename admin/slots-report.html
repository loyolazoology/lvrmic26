<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.t-Oral{background:rgba(31,122,104,.16);color:var(--teal-light);}
.t-Poster{background:rgba(205,163,85,.16);color:var(--gold-light);}
.x-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 22px;padding:6px 4px;}
.x-body div span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);}
.x-body div b{font-weight:500;color:var(--text-1);word-break:break-word;}
.x-body .wide{grid-column:1/-1;}
.seg{display:inline-flex;border:1px solid var(--navy-border);border-radius:8px;overflow:hidden;}
.seg button{background:transparent;border:0;color:var(--text-2);padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;}
.seg button.on{background:rgba(232,201,131,.12);color:var(--gold-light);}
.gh{padding:12px 14px;background:rgba(232,201,131,.06);border-bottom:1px solid var(--navy-border);color:var(--gold-light);font-size:14px;font-weight:600;}
.gh small{color:var(--text-3);font-weight:400;margin-left:8px;}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-table-list" style="color:var(--gold-light);"></i> Slot report</h1><a class="btn btn-sm" id="am" href="slots-manage.html"><i class="fa-solid fa-location-crosshairs"></i> Allot slots</a></div>
<div class="wrap" style="max-width:1400px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar noprint">
    <input id="q" placeholder="Search by name, VRMIC ID, venue or token" autocomplete="off">
    <select id="ft"><option value="">All categories</option><option>Oral</option><option>Poster</option></select>
    <select id="fd"><option value="">All days</option></select>
    <select id="fv"><option value="">All venues</option></select>
    <select id="fs"><option value="">Allotted and pending</option><option value="set">Allotted only</option><option value="unset">Pending only</option></select>
    <span class="seg" id="seg"><button data-m="flat" class="on">List</button><button data-m="group">By venue / day</button></span>
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <div id="xp" style="margin-left:auto;"></div>
  </div>

  <div id="out"><div class="empty">Loading slots…</div></div>
  <p class="tiny noprint" style="margin-top:10px;">Click a row to see the abstract title, contact details and map link. Only participants whose abstract is accepted appear here.</p>
</div>

<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('slot', 'report')) { VR.denied('You do not have permission to view the slot report.'); return; }
if (!VR.can('slot', 'transaction')) $('am').style.display = 'none';

let all = [], view = [], open = new Set(), mode = 'flat';
const accepted = r => (r.ParticipantType === 'Oral' || r.ParticipantType === 'Poster') && r.AbstractStatus === 'Accepted';
const has = r => !!r.SlotVenue, nz = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().toLowerCase();
const url = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
const cell = (k, v, wide) => '<div' + (wide ? ' class="wide"' : '') + '><span>' + esc(k) + '</span><b>' + (v === '' || v == null ? '—' : esc(v)) + '</b></div>';

function filtered() {
  const q = nz($('q').value), t = $('ft').value, d = $('fd').value, v = $('fv').value, s = $('fs').value;
  return all.filter(r => accepted(r) && (!q || [r.Name, r.ID, r.SlotVenue, r.SlotToken].some(x => nz(x).includes(q))) && (!t || r.ParticipantType === t) && (!d || r.SlotDate === d) && (!v || r.SlotVenue === v) && (s !== 'set' || has(r)) && (s !== 'unset' || !has(r)));
}
function rowHtml(r, withSlot) {
  const o = open.has(String(r.row)), map = url(r.SlotMapUrl);
  let h = '<tr data-row="' + esc(r.row) + '" style="cursor:pointer;"><td><i class="fa-solid fa-chevron-' + (o ? 'down' : 'right') + '" style="font-size:11px;color:var(--text-3);"></i></td><td class="id">' + esc(r.ID) + '</td><td class="nm">' + esc(r.Name) + '</td>'
    + '<td><span class="badge t-' + esc(r.ParticipantType) + '">' + esc(r.ParticipantType) + '</span></td>'
    + (withSlot ? '<td>' + esc(r.SlotVenue || '—') + '</td><td>' + esc(r.SlotRoom || '—') + '</td><td>' + esc(r.SlotDate || '—') + '</td>' : '') + '<td>' + esc(r.SlotTime || '—') + '</td><td class="id">' + esc(r.SlotToken || '—') + '</td></tr>';
  if (o) h += '<tr><td></td><td colspan="' + (withSlot ? 8 : 5) + '" style="background:rgba(232,201,131,.04);"><div class="x-body">' + cell('Abstract title', r.AbstractTitle, true) + cell('Theme', r.AbstractTheme) + cell('Institution', r.Institution) + cell('Email', r.Email) + cell('Phone', r.Phone) + cell('Mode', r.Mode)
    + '<div><span>Map</span><b>' + (map ? '<a target="_blank" rel="noopener" href="' + esc(map) + '">Open map</a>' : '—') + '</b></div></div></td></tr>';
  return h;
}
function render() {
  view = filtered();
  const pool = all.filter(accepted), done = pool.filter(has).length;
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  const vs = view.filter(has);
  $('stats').innerHTML = c('fa-user-check', 'Accepted presenters', pool.length, 'showing ' + view.length) + c('fa-location-dot', 'Allotted', done, pool.length ? Math.round(done * 100 / pool.length) + '% of all' : '—')
    + c('fa-hourglass-half', 'Pending', pool.length - done, 'no venue yet') + c('fa-building', 'Venues · days', new Set(vs.map(r => r.SlotVenue)).size + ' · ' + new Set(vs.map(r => r.SlotDate).filter(Boolean)).size, 'in the current view');
  if (!view.length) { $('out').innerHTML = '<div class="table-card"><div class="empty">' + (pool.length ? 'No slots match these filters.' : 'No abstracts have been accepted yet.') + '</div></div>'; return; }
  if (mode === 'flat') {
    $('out').innerHTML = '<div class="table-card"><div class="scroll-x" id="tc"><table class="list"><thead><tr><th style="width:26px;"></th><th>VRMIC ID</th><th>Name</th><th>Category</th><th>Venue</th><th>Room</th><th>Day</th><th>Time</th><th>Token</th></tr></thead><tbody>' + view.map(r => rowHtml(r, true)).join('') + '</tbody></table></div></div>';
  } else {
    const order = [], map = {};
    view.forEach(r => { const k = has(r) ? [r.SlotVenue, r.SlotRoom ? 'Room ' + r.SlotRoom : '', r.SlotDate].filter(Boolean).join(' · ') : 'Not yet allotted'; if (!map[k]) { map[k] = []; order.push(k); } map[k].push(r); });
    order.sort((a, b) => (a === 'Not yet allotted') - (b === 'Not yet allotted') || a.localeCompare(b));
    $('out').innerHTML = '<div id="tc">' + order.map(k => { const g = map[k].slice().sort((x, y) => String(x.SlotTime).localeCompare(String(y.SlotTime)) || String(x.SlotToken).localeCompare(String(y.SlotToken)));
      return '<div class="table-card" style="margin-bottom:16px;"><div class="gh">' + esc(k) + '<small>' + g.length + ' presenter' + (g.length > 1 ? 's' : '') + '</small></div><div class="scroll-x"><table class="list"><thead><tr><th style="width:26px;"></th><th>VRMIC ID</th><th>Name</th><th>Category</th><th>Time</th><th>Token</th></tr></thead><tbody>' + g.map(r => rowHtml(r, false)).join('') + '</tbody></table></div></div>'; }).join('') + '</div>';
  }
}
async function load() {
  $('out').innerHTML = '<div class="empty">Loading slots…</div>';
  try {
    const r = await VR.api('adminListParticipants', {}); if (!r.ok) { $('out').innerHTML = ''; return showErr(r.error || 'Could not load slots.'); }
    all = r.participants || []; const pool = all.filter(accepted), fd = $('fd').value, fv = $('fv').value;
    $('fd').innerHTML = '<option value="">All days</option>' + [...new Set(pool.map(x => x.SlotDate).filter(Boolean))].map(v => '<option>' + esc(v) + '</option>').join(''); $('fd').value = fd;
    $('fv').innerHTML = '<option value="">All venues</option>' + [...new Set(pool.map(x => x.SlotVenue).filter(Boolean))].map(v => '<option>' + esc(v) + '</option>').join(''); $('fv').value = fv;
    render();
  } catch (e) { $('out').innerHTML = ''; showErr('Could not reach the server. Check your connection and try again.'); }
}
$('q').addEventListener('input', render); ['ft', 'fd', 'fv', 'fs'].forEach(i => $(i).addEventListener('change', render)); $('refresh').onclick = load;
$('seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); render(); };
$('out').onclick = e => { if (e.target.closest('a,button')) return; const tr = e.target.closest('tr[data-row]'); if (!tr) return; const k = tr.dataset.row; open.has(k) ? open.delete(k) : open.add(k); render(); };

VR.exportBar($('xp'), { name: 'VRMIC2026_Slot_Report', title: 'VRMIC 2026 — Slot report', imageEl: () => $('tc') || $('out'), pdfOpts: { orientation: 'landscape' },
  getData: () => ({ headers: ['VRMIC ID', 'Name', 'Category', 'Venue', 'Room', 'Day', 'Time', 'Token', 'Title', 'Institution'], rows: view.map(r => [r.ID, r.Name, r.ParticipantType, r.SlotVenue || '', r.SlotRoom || '', r.SlotDate || '', r.SlotTime || '', r.SlotToken || '', r.AbstractTitle || '', r.Institution || '']) }) });

load();
})();
</script>
</body>
</html>
