<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin-common.css">
<style>
.btn-success{background:rgba(79,169,128,.14);border-color:rgba(79,169,128,.4);color:var(--teal-light);}
.btn-warn{background:rgba(219,164,60,.12);border-color:rgba(219,164,60,.45);color:var(--warn);}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 14px;}
.sec i{color:var(--gold-light);} .sec h2{font-size:1.05rem;margin:0;}
.sec .n{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-3);}
.t-Oral{background:rgba(31,122,104,.16);color:var(--teal-light);}
.t-Poster{background:rgba(205,163,85,.16);color:var(--gold-light);}
.a-Accepted{background:rgba(79,169,128,.14);color:var(--teal-light);}
.a-Submitted,.a-Revision{background:rgba(219,164,60,.14);color:var(--warn);}
.a-Rejected{background:rgba(216,105,90,.14);color:#e8988c;}
.a-Not{background:rgba(179,188,214,.1);color:var(--text-2);}
.a-Info{background:rgba(120,160,230,.14);color:#a9c3f0;}
.note{text-align:center;padding:38px 20px;color:var(--text-3);border:1px dashed var(--navy-border);border-radius:14px;}
.note i{font-size:24px;color:var(--gold-light);display:block;margin-bottom:8px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;}
.tab{background:var(--navy-900);border:1px solid var(--navy-border);color:var(--text-2);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.tab b{font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-left:6px;color:var(--text-3);}
.tab.on{border-color:var(--gold);color:var(--gold-light);background:rgba(232,201,131,.08);} .tab.on b{color:var(--gold-light);}
.qi{background:linear-gradient(180deg,var(--navy-850),var(--navy-900));border:1px solid var(--navy-border);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.qi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;cursor:pointer;}
.qi-name{font-family:'Fraunces',serif;font-size:1.08rem;color:var(--text-1);}
.qi-meta{font-size:12.5px;color:var(--text-3);}
.qi-title{font-size:14px;color:var(--text-1);margin:10px 0 4px;font-weight:600;}
.qi-theme{font-size:12.5px;color:var(--teal-light);}
.qi-body{display:none;margin-top:10px;} .qi.open .qi-body{display:block;}
.rv{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-3);margin-left:8px;}
.remark{background:var(--navy-950);border-left:3px solid var(--gold);border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--text-2);margin:10px 0;white-space:pre-wrap;}
.remark b{color:var(--gold-light);display:block;font-size:11px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px;}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 20px;margin:8px 0;}
.facts div span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);}
.facts div b{font-weight:500;color:var(--text-1);word-break:break-word;}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);margin-top:12px;} .chk input{width:auto;}
textarea{width:100%;min-height:96px;resize:vertical;}
.x-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 22px;padding:6px 4px;}
.x-body div span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);}
.x-body div b{font-weight:500;color:var(--text-1);word-break:break-word;white-space:pre-wrap;}
.x-body .wide{grid-column:1/-1;}
table.list td.ti{white-space:normal;min-width:220px;max-width:380px;}
table.list td.rm{white-space:normal;min-width:200px;max-width:340px;font-size:12.5px;color:var(--text-2);}
.over{color:#e8988c;font-weight:600;} .ok{}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
.bars div{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px;color:var(--text-2);}
.bars .l{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .bars .b{flex:1;height:8px;background:var(--navy-950);border-radius:6px;overflow:hidden;} .bars .b i{display:block;height:100%;background:var(--gold);} .bars .c{flex:0 0 32px;text-align:right;font-family:'IBM Plex Mono',monospace;}
.qs{background:linear-gradient(180deg,var(--navy-850),var(--navy-900));border:1px solid var(--navy-border);border-radius:14px;padding:16px 20px;margin-bottom:14px;}
.qs h4{margin:0 0 4px;font-size:14.5px;color:var(--text-1);} .qs .m{font-size:12px;color:var(--text-3);margin-bottom:10px;}
.big{font-family:'Fraunces',serif;font-size:1.7rem;color:var(--gold-light);margin-right:10px;}
.txs{max-height:260px;overflow:auto;border:1px solid var(--navy-border);border-radius:10px;}
.txs div{padding:8px 12px;border-bottom:1px solid var(--navy-border);font-size:13px;color:var(--text-2);white-space:pre-wrap;} .txs div:last-child{border:0;} .txs small{display:block;color:var(--text-3);font-size:11px;margin-top:2px;}
.bars .l{flex:0 0 38%;}
details.lg{margin-top:22px;} details.lg summary{cursor:pointer;color:var(--gold-light);font-size:14px;margin-bottom:10px;}
</style>
</head>
<body>

<div class="topbar"><h1><i class="fa-solid fa-chart-column" style="color:var(--gold-light);"></i> Feedback report</h1><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><span id="xp"></span><a class="btn btn-sm" id="mg" href="feedback-manage.html"><i class="fa-solid fa-clipboard-question"></i> Question builder</a></div></div>
<div class="wrap" style="max-width:1200px;">
  <div class="alert" id="err"></div><div class="alert" id="ok"></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar noprint">
    <select id="fd"><option value="">All days</option></select><select id="fv"><option value="">All venues</option></select><select id="fc"><option value="">All categories</option></select><select id="ft"><option value="">All participant types</option><option>Oral</option><option>Poster</option><option>Participant</option></select>
    <label class="tiny" style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="sn" checked style="width:auto;"> Show names beside text answers</label>
    <button class="btn btn-sm" id="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
  </div>
  <div id="sum"><div class="empty">Loading feedback…</div></div>

  <div class="sec" style="margin-top:26px;"><i class="fa-solid fa-user-check"></i><h2>Who answered</h2><span class="n" id="n1"></span></div>
  <div class="table-card"><div class="scroll-x"><table class="list"><thead><tr><th>VRMIC ID</th><th>Name</th><th>E-mail</th><th>Type</th><th>Category</th><th>Venue</th><th>Submitted</th><th>Last edited</th></tr></thead><tbody id="tb"></tbody></table></div></div>
  <p class="tiny" style="margin-top:8px;">Participants never see these results. Names are visible to admins only.</p>
  <div id="lg"></div>
</div>
<script src="admin-common.js"></script>
<script src="admin-page.js"></script>
<script>
if (VR.guard() && VR.frameOnly()) (function () {
if (!VR.can('feedback', 'report') && !VR.can('feedback', 'transaction')) { VR.denied('You do not have permission to view the feedback report.'); return; }
if (!VR.can('feedback', 'transaction')) $('mg').style.display = 'none';
let D = null, E = {}, view = [], rows = [];
const dtm = v => { const d = new Date(v); return !v || isNaN(d) ? '—' : d.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }); };
const scopeLabel = q => q.scopeType === 'day' ? 'Day: ' + fmtD(q.scopeValue) : q.scopeType === 'venue' ? 'Venue: ' + q.scopeValue : 'Whole conference';
const TY = { rating: 'Rating', short: 'Short text', long: 'Long text', single: 'Single choice', multi: 'Multiple choice', yesno: 'Yes / No' };
function pass(x, days) {
  const d = $('fd').value, v = $('fv').value, c = $('fc').value, t = $('ft').value;
  return (!d || (days || []).indexOf(d) > -1) && (!v || x.venue === v) && (!c || x.category === c) && (!t || x.type === t);
}
function bars(pairs, total, avgLine) {
  const mx = Math.max(1, ...pairs.map(p => p[1]));
  return pairs.map(p => '<div><span class="l" title="' + esc(p[0]) + '">' + esc(p[0]) + '</span><span class="b"><i style="width:' + Math.round(p[1] * 100 / mx) + '%"></i></span><span class="c" style="flex-basis:80px;">' + p[1] + (total ? ' · ' + Math.round(p[1] * 100 / total) + '%' : '') + '</span></div>').join('');
}
function render() {
  const el = D.eligible.filter(e => pass(e, e.days)), resp = D.responses.filter(r => pass(r, (E[r.pid] || {}).days));
  const pids = new Set(resp.map(r => r.pid)); view = resp;
  const c = (ic, h, v, s) => '<div class="sc"><i class="fa-solid ' + ic + '"></i><h4>' + h + '</h4><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  $('stats').innerHTML = c('fa-users', 'Registered', el.length, 'in this selection') + c('fa-comments', 'Responded', resp.length, 'submitted feedback') + c('fa-percent', 'Response rate', el.length ? Math.round(resp.length * 100 / el.length) + '%' : '—', 'responded ÷ registered') + c('fa-list-check', 'Questions', D.questions.length, D.questions.filter(q => !q.active).length + ' inactive');
  const byQ = {}; D.answers.forEach(a => { if (pids.has(a.pid)) (byQ[a.qid] = byQ[a.qid] || []).push(a); });
  const nameOf = {}; resp.forEach(r => nameOf[r.pid] = r.name);
  rows = [];
  $('sum').innerHTML = D.questions.length ? D.questions.map((q, i) => {
    const a = byQ[q.id] || [], n = a.length; let body = '';
    if (q.type === 'rating') {
      const vals = a.map(x => Number(x.a)), avg = n ? vals.reduce((s, v) => s + v, 0) / n : 0;
      body = '<div style="margin-bottom:8px;"><span class="big">' + (n ? avg.toFixed(2) : '—') + '</span><span class="tiny" style="display:inline;">average out of 5</span></div><div class="bars">' + bars([5, 4, 3, 2, 1].map(k => [k + ' ★', vals.filter(v => v === k).length]), n) + '</div>';
      rows.push([q.text, 'Rating', n, avg ? avg.toFixed(2) : '', [1, 2, 3, 4, 5].map(k => k + ':' + vals.filter(v => v === k).length).join('  ')]);
    } else if (q.type === 'yesno' || q.type === 'single') {
      const opts = q.type === 'yesno' ? ['Yes', 'No'] : q.options.slice(); a.forEach(x => { if (opts.indexOf(x.a) === -1) opts.push(x.a); });
      const pairs = opts.map(o => [o, a.filter(x => x.a === o).length]); body = '<div class="bars">' + bars(pairs, n) + '</div>'; rows.push([q.text, TY[q.type], n, '', pairs.map(p => p[0] + ':' + p[1]).join('  ')]);
    } else if (q.type === 'multi') {
      const cnt = {}; q.options.forEach(o => cnt[o] = 0); a.forEach(x => { let arr = []; try { arr = JSON.parse(x.a); } catch (e) {} arr.forEach(o => cnt[o] = (cnt[o] || 0) + 1); });
      const pairs = Object.entries(cnt); body = '<div class="bars">' + bars(pairs, n) + '</div><div class="tiny">Percentages are of the ' + n + ' people who answered.</div>'; rows.push([q.text, TY[q.type], n, '', pairs.map(p => p[0] + ':' + p[1]).join('  ')]);
    } else {
      const sn = $('sn').checked;
      body = n ? '<div class="txs">' + a.map(x => '<div>' + esc(x.a) + (sn ? '<small>' + esc(nameOf[x.pid] || x.pid) + ' · ' + esc(x.pid) + '</small>' : '') + '</div>').join('') + '</div>' : '';
      rows.push([q.text, TY[q.type], n, '', a.map(x => x.a).join(' | ')]);
    }
    return '<div class="qs"><h4>' + (i + 1) + '. ' + esc(q.text) + (q.active ? '' : ' <span class="badge a-Rejected">Inactive</span>') + '</h4><div class="m">' + TY[q.type] + ' · ' + esc(scopeLabel(q)) + ' · ' + n + ' answer(s)' + (resp.length ? ' · ' + Math.round(n * 100 / resp.length) + '% of respondents' : '') + '</div>' + (n ? body : '<span class="hint">No answers in this selection.</span>') + '</div>';
  }).join('') : '<div class="note"><i class="fa-solid fa-clipboard-question"></i>No questions have been created yet.</div>';
  $('n1').textContent = '(' + resp.length + ')';
  $('tb').innerHTML = resp.length ? resp.slice().sort((x, y) => new Date(y.submittedAt) - new Date(x.submittedAt)).map(r => '<tr><td class="id">' + esc(r.pid) + '</td><td class="nm">' + esc(r.name) + '</td><td>' + esc(r.email) + '</td><td>' + esc(r.type) + '</td><td>' + esc(r.category || '—') + '</td><td>' + esc(r.venue || '—') + '</td><td>' + dtm(r.submittedAt) + '</td><td>' + (r.updatedAt !== r.submittedAt ? dtm(r.updatedAt) : '—') + '</td></tr>').join('') : '<tr><td class="empty" colspan="8">No responses in this selection.</td></tr>';
}
function legacy() {
  const L = D.legacy || []; if (!L.length) { $('lg').innerHTML = ''; return; }
  const keys = {}; L.forEach(l => Object.keys(l.ratings || {}).forEach(k => { (keys[k] = keys[k] || []).push(Number(l.ratings[k])); }));
  $('lg').innerHTML = '<details class="lg"><summary><i class="fa-solid fa-box-archive"></i> Earlier feedback (legacy) — ' + L.length + ' entries</summary>'
    + '<div class="table-card"><table class="list"><thead><tr><th>Question</th><th>Answers</th><th>Average</th></tr></thead><tbody>' + Object.entries(keys).map(([k, v]) => { const n = v.filter(x => !isNaN(x)); return '<tr><td>' + esc(k) + '</td><td>' + n.length + '</td><td>' + (n.length ? (n.reduce((s, x) => s + x, 0) / n.length).toFixed(2) : '—') + '</td></tr>'; }).join('') + '</tbody></table></div>'
    + '<div class="table-card" style="margin-top:12px;"><table class="list"><thead><tr><th>Name</th><th>Comments</th><th>Date</th></tr></thead><tbody>' + L.filter(l => String(l.comments || '').trim()).map(l => '<tr><td class="nm">' + esc(l.name) + '</td><td style="white-space:normal;">' + esc(l.comments) + '</td><td>' + dtm(l.createdAt) + '</td></tr>').join('') + '</tbody></table></div></details>';
}
async function load() {
  try {
    const r = await VR.api('adminFeedbackReport', {});
    if (!r.ok) { $('sum').innerHTML = ''; return showErr(r.error || 'Could not load the report.'); }
    D = r; E = {}; D.eligible.forEach(e => E[e.id] = e);
    const k = ['fd', 'fv', 'fc'].map(i => $(i).value);
    $('fd').innerHTML = '<option value="">All days</option>' + D.days.map(d => '<option value="' + esc(d) + '">' + esc(fmtD(d)) + '</option>').join('');
    $('fv').innerHTML = '<option value="">All venues</option>' + [...new Set(D.eligible.map(e => e.venue).filter(Boolean))].sort().map(x => '<option>' + esc(x) + '</option>').join('');
    $('fc').innerHTML = '<option value="">All categories</option>' + [...new Set(D.eligible.map(e => e.category).filter(Boolean))].sort().map(x => '<option>' + esc(x) + '</option>').join('');
    ['fd', 'fv', 'fc'].forEach((i, j) => $(i).value = k[j]); render(); legacy();
  } catch (e) { showErr('Could not reach the server. Check your connection and try again.'); }
}
['fd', 'fv', 'fc', 'ft', 'sn'].forEach(i => $(i).addEventListener('change', () => D && render())); $('refresh').onclick = load;
VR.exportBar($('xp'), { name: 'VRMIC2026_Feedback', title: 'VRMIC 2026 — Feedback responses', imageEl: () => $('sum'), pdfOpts: { orientation: 'landscape' },
  getData: () => {
    const qs = D.questions, byP = {}; D.answers.forEach(a => { (byP[a.pid] = byP[a.pid] || {})[a.qid] = a.a; });
    const fmt = (q, v) => { if (v == null) return ''; if (q.type === 'multi') { try { return JSON.parse(v).join('; '); } catch (e) { return v; } } return v; };
    return { headers: ['VRMIC ID', 'Name', 'E-mail', 'Type', 'Category', 'Venue', 'Submitted'].concat(qs.map(q => q.text)),
      rows: view.map(r => [r.pid, r.name, r.email, r.type, r.category, r.venue, dtm(r.submittedAt)].concat(qs.map(q => fmt(q, (byP[r.pid] || {})[q.id])))) };
  } });
load();
})();
</script>
</body>
</html>
